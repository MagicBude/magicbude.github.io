<!DOCTYPE html>
<!--
  about.html - 关于页
  协同：js/site.config.js（bio / nav / social 数据源）、js/main.js（头部 / 页脚）、js/i18n.js。
  数据驱动：引言 / 简介 / 板块卡片 / 联系胶囊由 window.renderAbout 从 SITE_CONFIG 渲染。
-->
<html lang="zh" data-style="instrument" data-scheme="dark">
<!-- #region 头部 head（meta / 防闪白脚本 / 样式） -->
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>关于 · magicbude</title>
  <meta name="description" content="关于 magicbude：一个喜欢动手的全栈玩家，以及这个站有什么。">

  <!--
    防闪白内联脚本：CSS 加载前先根据 localStorage 设好皮肤/语言，
    键名 "site-style" / "site-lang" 与 js/main.js、js/i18n.js 保持一致。
  -->
  <script>
    (function () {
      try {
        var s = localStorage.getItem("site-style") || "instrument";
        var l = localStorage.getItem("site-lang") || "zh";
        var scheme = (s === "instrument" || s === "terminal") ? "dark" : "light";
        var d = document.documentElement;
        d.setAttribute("data-style", s);
        d.setAttribute("data-scheme", scheme);
        d.setAttribute("lang", l);
      } catch (e) {}
    })();
  </script>

  <link rel="stylesheet" href="css/main.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d1117'/%3E%3Crect x='9' y='9' width='14' height='14' rx='4' fill='%234aa8ff'/%3E%3C/svg%3E">
<!-- #endregion -->
</head>
<!-- #region 页面骨架（导航 / 页脚容器 + 内容区块） -->
<body>
  <a class="skip-link" href="#main" data-i18n="common.skip">跳到主内容</a>

  <!-- 头部容器：js/main.js 根据 site.config.js 注入导航（数据驱动，不写死） -->
  <header id="site-header" class="site-header"></header>

  <main class="site-main" id="main">
    <!-- ============ 页面引言 ============ -->
    <section class="hero container container--narrow">
      <!-- 小标签（eyebrow）：比标题低一级，用来点明这是「关于」页 -->
      <p class="page-eyebrow" data-i18n="about.eyebrow">关于</p>
      <!-- 名字与定位从 site.config.js 读，中英切换时由 renderAbout 刷新 -->
      <h1 class="hero__name" id="about-name">magicbude</h1>
      <span class="hero__tagline" id="about-tagline" data-i18n="home.badge">在代码与兴趣之间</span>
    </section>

    <!-- ============ 自我介绍（长文，用 .prose 排版） ============ -->
    <section class="section container container--narrow">
      <!-- 内容由 renderAbout 用 config.bio 填充；JS 没跑也留兜底文字 -->
      <div class="prose" id="about-bio">我是 magicbude，一个喜欢动手的全栈开发者。</div>
    </section>

    <!-- ============ 这个站有（板块入口，复用首页卡片模式） ============ -->
    <section class="section container">
      <div class="section__header">
        <h2 class="section__title" data-i18n="about.section.here">这个站有</h2>
      </div>
      <!-- 卡片由 renderAbout 根据 nav 生成（排除 首页/搜索/关于 自身） -->
      <div class="card-grid" id="about-sections"></div>
    </section>

    <!-- ============ 联系我 ============ -->
    <section class="section container container--narrow">
      <div class="section__header">
        <h2 class="section__title" data-i18n="about.section.contact">联系我</h2>
      </div>
      <p class="about-contact-desc" data-i18n="about.section.contactDesc">在这些地方可以找到我：</p>
      <!-- 社交链接胶囊，由 renderAbout 根据 config.social 生成 -->
      <div class="contact-list" id="about-contact"></div>
    </section>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

<!-- #endregion -->
<!-- #region 脚本（依赖加载 + 本页数据 -> DOM 渲染） -->
  <!-- 脚本顺序：配置 → 图标 → 多语 → 主逻辑 -->
  <script src="js/site.config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/main.js"></script>

  <!--
    关于页的「数据 → DOM」渲染脚本。
    挂到 window.renderAbout：main.js 在切换语言时会调用它，让本页文案同步刷新
    （和 home.html 的 window.renderHome 是同一个解耦模式）。
  -->
  <script>
  (function () {
    "use strict";

    var CONFIG = window.SITE_CONFIG || {};
    var ICON  = window.icon  || function () { return ""; };
    var I18N  = window.i18n  || { t: function (k) { return k; }, getLang: function () { return "zh"; } };

    // 导航 key → 图标名（与 home.html 保持一致）。
    var NAV_ICON = {
      home: "home", blog: "book", projects: "code",
      now: "sparkles", uses: "tool", links: "link",
      search: "search", about: "user"
    };

    // 「这个站有」卡片的一句话说明（多语）。和 home 的入口说明同源，
    // 集中写在这里，改文案只动这一处。
    var ENTRY_DESC = {
      blog:     { zh: "写代码、做小工具的记录与踩坑",   en: "Notes & lessons from coding and tinkering" },
      projects: { zh: "我做过的网站、工具与开源项目",   en: "Sites, tools and open-source I've built" },
      now:      { zh: "最近在玩、在看、在搞啥",         en: "What I'm playing, watching and building now" },
      uses:     { zh: "日常在用的硬件与软件",           en: "Hardware & software I use daily" },
      links:    { zh: "朋友们和觉得有用的站",           en: "Friends and useful sites" }
    };

    function renderAbout() {
      var lang = I18N.getLang();

      // ---- 1) 引言：名字 + 定位 ----
      var nameEl = document.getElementById("about-name");
      if (nameEl && CONFIG.name) nameEl.textContent = CONFIG.name;

      var tagEl = document.getElementById("about-tagline");
      if (tagEl && CONFIG.tagline) tagEl.textContent = CONFIG.tagline[lang] || CONFIG.tagline.zh;

      // ---- 2) 自我介绍长文 ----
      var bioEl = document.getElementById("about-bio");
      if (bioEl && CONFIG.bio) bioEl.textContent = CONFIG.bio[lang] || CONFIG.bio.zh;

      // ---- 3) 「这个站有」卡片（排除 首页 / 搜索 / 关于 自身） ----
      var grid = document.getElementById("about-sections");
      if (grid && CONFIG.nav) {
        grid.innerHTML = CONFIG.nav
          .filter(function (it) { return it.key !== "home" && it.key !== "search" && it.key !== "about"; })
          .map(function (it) {
            var ic    = NAV_ICON[it.key] || "layout";
            var label = I18N.t(it.i18n);
            var desc  = ENTRY_DESC[it.key] ? (ENTRY_DESC[it.key][lang] || ENTRY_DESC[it.key].zh) : "";
            return (
              '<a class="card" href="' + it.href + '">' +
                '<span class="card__title">' + ICON(ic) + "<span>" + label + "</span></span>" +
                '<span class="card__desc">' + desc + "</span>" +
                '<span class="card__link">' + I18N.t("section.viewAll") + ICON("arrowRight") + "</span>" +
              "</a>"
            );
          })
          .join("");
      }

      // ---- 4) 联系我：社交链接做成胶囊按钮 ----
      var contact = document.getElementById("about-contact");
      if (contact && CONFIG.social) {
        contact.innerHTML = CONFIG.social.map(function (s) {
          return (
            '<a class="btn btn--ghost" href="' + s.url + '" target="_blank" rel="noopener">' +
              ICON(s.type) + "<span>" + (s.label || s.type) + "</span>" +
            "</a>"
          );
        }).join("");
      }
    }

    // 暴露给 main.js 的语言切换钩子。
    window.renderAbout = renderAbout;
    renderAbout();
  })();
  </script>
<!-- #endregion -->
</body>
</html>
