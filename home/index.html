<!DOCTYPE html>
<!--
  home/index.html - 旧首页地址的兼容跳转页
  作用：网站首页合并到根路径后，继续接住历史书签与旧链接。
  协同：不依赖公共脚本；相对地址同时兼容 GitHub Pages 与本地双击预览。
-->
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>正在前往 magicbude</title>
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="0; url=../">
  <link rel="canonical" href="https://magicbude.github.io/">
</head>
<body>
  <main>
    <p>首页已经迁移，正在前往<a href="../">网站首页</a>。</p>
  </main>
  <script>
    // replace 不会把兼容页留在浏览历史里，点击“后退”时不会再次触发跳转。
    window.location.replace("../");
  </script>
</body>
</html>
