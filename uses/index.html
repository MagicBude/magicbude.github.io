<!DOCTYPE html>
<!--
  uses/index.html - 工作台与工具箱页
  协同：assets/js/core/ 中的公共头部、页脚与多语言脚本。
  数据驱动：assets/js/data/uses.js 提供已确认工作流、参考工具与分类；
  页面脚本负责统计、双语渲染和分类筛选，不在 HTML 中写死个人设备。
-->
<html lang="zh" data-style="magazine" data-scheme="light">
<!-- #region 头部 head（meta / 防闪白脚本 / 样式） -->
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>工作台 · magicbude</title>
  <meta name="description" content="magicbude 制作个人网站的已确认工作流，以及一份不等同于日常使用的参考工具箱。">

  <script>
    (function () {
      try {
        var s = localStorage.getItem("site-style") || "magazine";
        var l = localStorage.getItem("site-lang") || "zh";
        var scheme = (s === "instrument" || s === "terminal") ? "dark" : "light";
        var d = document.documentElement;
        d.setAttribute("data-style", s);
        d.setAttribute("data-scheme", scheme);
        d.setAttribute("lang", l);
      } catch (e) {}
    })();
  </script>

  <link rel="stylesheet" href="../assets/css/main.css">
<!-- #endregion -->
  <link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
<!-- #region 页面骨架（导航 / 页脚容器 + 内容区块） -->
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="common.skip">跳到主内容</a>

  <header id="site-header" class="site-header"></header>

  <main class="site-main" id="main">
    <!-- #region 工作台引言与核对信息 -->
    <section class="hero container uses-hero">
      <div class="uses-hero__copy">
        <p class="page-eyebrow" data-i18n="uses.eyebrow">工作台</p>
        <h1 class="hero__name" data-i18n="uses.title">本站如何被制作</h1>
        <p class="lead" data-i18n="uses.lead">先公开能够从仓库确认的制作流程；个人设备与日常软件等信息，确认以后再加入。</p>
      </div>

      <!-- 右侧摘要由 uses.js 的真实数组计算，数据增减时不需要手改数字。 -->
      <aside class="uses-ledger" aria-labelledby="uses-ledger-title">
        <div class="uses-ledger__topline">
          <span class="uses-ledger__mark" aria-hidden="true"></span>
          <p id="uses-ledger-title" data-i18n="uses.snapshot.kicker">VERIFIED WORKFLOW</p>
        </div>
        <p class="uses-ledger__updated"><span data-i18n="uses.updated">最后核对</span> <time id="uses-updated" datetime="2026-08-18">2026.08.18</time></p>
        <dl class="uses-ledger__stats">
          <div><dt data-i18n="uses.categories">流程分组</dt><dd id="uses-category-count">0</dd></div>
          <div><dt data-i18n="uses.steps">确认条目</dt><dd id="uses-item-count">0</dd></div>
          <div><dt data-i18n="uses.references">参考工具</dt><dd id="uses-tool-count">0</dd></div>
        </dl>
        <p class="uses-ledger__note" data-i18n="uses.snapshot.note">这里的“正在使用”只指已核实的本站工作流，不延伸猜测个人设备。</p>
      </aside>
    </section>
    <!-- #endregion 工作台引言与核对信息 -->

    <div class="container uses-content">
      <!-- #region 已确认工作台 -->
      <section class="uses-block" aria-labelledby="gear-title">
        <header class="uses-block__heading">
          <p class="uses-block__index">01 / WORKBENCH</p>
          <div>
            <h2 id="gear-title" data-i18n="uses.gearTitle">已确认的工作台</h2>
            <p data-i18n="uses.gearLead">这些内容可以直接由当前仓库结构、文件和发布方式验证。</p>
          </div>
        </header>
        <div id="uses-root"></div>
      </section>
      <!-- #endregion 已确认工作台 -->

      <!-- #region 参考工具箱 -->
      <section class="uses-block uses-block--toolbox" aria-labelledby="toolbox-title">
        <header class="uses-block__heading">
          <p class="uses-block__index">02 / REFERENCE</p>
          <div>
            <h2 id="toolbox-title" data-i18n="uses.toolboxTitle">参考工具箱</h2>
            <p data-i18n="uses.toolboxLead">一份精简的软件索引，方便需要时回看；收录不代表已经安装、购买或正在使用。</p>
          </div>
        </header>

        <!--
          筛选按钮由数据中的分类动态生成。使用一个容器监听点击事件，
          即使以后增加分类，也不需要为每个新按钮单独绑定监听器。
        -->
        <div class="toolbox-filters" id="toolbox-filters" aria-label="工具分类"></div>
        <div class="toolbox-list" id="toolbox-root"></div>
        <p class="empty-state" id="toolbox-empty" hidden data-i18n="uses.empty">这个分类还没有工具。</p>
      </section>
      <!-- #endregion 参考工具箱 -->
    </div>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

<!-- #endregion -->
<!-- #region 脚本（依赖加载 + 本页数据 -> DOM 渲染） -->
  <script src="../assets/js/core/site.config.js"></script>
  <script src="../assets/js/core/icons.js"></script>
  <script src="../assets/js/core/i18n.js"></script>
  <script src="../assets/js/core/main.js"></script>
  <script src="../assets/js/data/uses.js"></script>

  <!--
    工作台页「数据 → DOM」：已确认流程按分类渲染，摘要数字从数组计算；
    参考工具箱先按当前分类筛选，再映射为紧凑索引。切换语言时 main.js 会重新调用。
  -->
  <script>
  (function () {
    "use strict";

    var ICON = window.icon || function () { return ""; };
    var I18N = window.i18n || { t: function (k) { return k; }, getLang: function () { return "zh"; } };
    var activeToolCategory = "all";
    var filtersBound = false;

    // 所有外部数据在插入 innerHTML 前统一转义，避免名称中的特殊字符破坏标签结构。
    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function localized(value, lang) {
      return value && (value[lang] || value.zh || value.en) || "";
    }

    // 名称允许使用普通字符串或双语对象，旧数据迁移时也不会渲染成 [object Object]。
    function localizeName(value, lang) {
      return typeof value === "string" ? value : localized(value, lang);
    }

    // 有资料链接的条目使用 <a>，纯站内事实使用 <article>，不制造 href="#" 的假链接。
    function renderWorkflowCard(item, lang, index) {
      var tag = item.url ? "a" : "article";
      var attrs = item.url ? ' href="' + escapeHtml(item.url) + '" target="_blank" rel="noopener"' : "";
      return (
        "<" + tag + ' class="uses-workflow-card"' + attrs + ">" +
          '<header class="uses-workflow-card__top"><span>' + String(index + 1).padStart(2, "0") +
          '</span><span>' + escapeHtml(localized(item.type, lang)) + "</span></header>" +
          '<h4 class="uses-workflow-card__title">' + escapeHtml(localizeName(item.name, lang)) + "</h4>" +
          '<p class="uses-workflow-card__desc">' + escapeHtml(localized(item.note, lang)) + "</p>" +
          (item.url ? '<span class="uses-workflow-card__link">' + escapeHtml(I18N.t("uses.viewReference")) + ICON("external") + "</span>" : "") +
        "</" + tag + ">"
      );
    }

    function renderGear(lang) {
      var root = document.getElementById("uses-root");
      if (!root) return;
      root.innerHTML = (window.USES || []).map(function (category, categoryIndex) {
        return (
          '<section class="uses-category uses-category--' + escapeHtml(category.key || "general") + '">' +
            '<header class="uses-category__header"><span class="uses-category__icon">' + ICON(category.icon || "layout") +
              '</span><div><span class="uses-category__number">0' + (categoryIndex + 1) +
              '</span><h3 class="uses-category__title">' + escapeHtml(localized(category.title, lang)) + "</h3></div></header>" +
            '<div class="uses-category__items">' + (category.items || []).map(function (item, itemIndex) {
              return renderWorkflowCard(item, lang, itemIndex);
            }).join("") + "</div>" +
          "</section>"
        );
      }).join("");
    }

    function renderToolFilters(lang) {
      var root = document.getElementById("toolbox-filters");
      var categories = window.TOOL_CATEGORIES || {};
      if (!root) return;
      var allCount = (window.TOOLBOX || []).length;
      var buttons = '<button class="tag tag-btn' + (activeToolCategory === "all" ? " is-active" : "") +
        '" type="button" data-category="all" aria-pressed="' + (activeToolCategory === "all") + '">' +
        escapeHtml(I18N.t("uses.filterAll")) + '<span class="toolbox-filter__count">' + allCount + "</span></button>";
      buttons += Object.keys(categories).map(function (key) {
        var category = categories[key];
        var count = (window.TOOLBOX || []).filter(function (tool) { return tool.category === key; }).length;
        return '<button class="tag tag-btn' + (activeToolCategory === key ? " is-active" : "") +
          '" type="button" data-category="' + key + '" aria-pressed="' + (activeToolCategory === key) + '">' +
          ICON(category.icon) + escapeHtml(localized(category.label, lang)) +
          '<span class="toolbox-filter__count">' + count + "</span></button>";
      }).join("");
      root.innerHTML = buttons;
    }

    function renderToolbox(lang) {
      var root = document.getElementById("toolbox-root");
      var empty = document.getElementById("toolbox-empty");
      var categories = window.TOOL_CATEGORIES || {};
      var tools = window.TOOLBOX || [];
      if (!root) return;
      if (activeToolCategory !== "all") {
        tools = tools.filter(function (tool) { return tool.category === activeToolCategory; });
      }
      if (empty) empty.hidden = tools.length > 0;
      root.innerHTML = tools.map(function (tool, index) {
        var category = categories[tool.category] || { label: {}, icon: "tool" };
        return (
          '<a class="tool-card" href="' + escapeHtml(tool.url) + '" target="_blank" rel="noopener">' +
            '<span class="tool-card__index">' + String(index + 1).padStart(2, "0") + "</span>" +
            '<span class="tool-card__identity"><strong>' + escapeHtml(tool.name) +
              '</strong><span>' + escapeHtml(localized(tool.note, lang)) + "</span></span>" +
            '<span class="tag tool-card__category">' + ICON(category.icon) + escapeHtml(localized(category.label, lang)) + "</span>" +
            '<span class="tool-card__arrow">' + ICON("arrowRight") + "</span>" +
          "</a>"
        );
      }).join("");
    }

    function bindToolFilters() {
      var root = document.getElementById("toolbox-filters");
      if (!root || filtersBound) return;
      root.addEventListener("click", function (event) {
        var button = event.target.closest("[data-category]");
        if (!button) return;
        activeToolCategory = button.getAttribute("data-category") || "all";
        renderUses();
      });
      filtersBound = true;
    }

    function renderUses() {
      var lang = I18N.getLang();
      var categories = window.USES || [];
      var itemCount = categories.reduce(function (sum, category) {
        return sum + (category.items || []).length;
      }, 0);
      var categoryCount = document.getElementById("uses-category-count");
      var itemCountHost = document.getElementById("uses-item-count");
      var toolCount = document.getElementById("uses-tool-count");
      if (categoryCount) categoryCount.textContent = categories.length;
      if (itemCountHost) itemCountHost.textContent = itemCount;
      if (toolCount) toolCount.textContent = (window.TOOLBOX || []).length;
      renderUpdatedDate(lang);
      renderGear(lang);
      renderToolFilters(lang);
      renderToolbox(lang);
      bindToolFilters();
    }

    // 手工核对日期按本地年月日构造，避免 YYYY-MM-DD 被当成 UTC 后显示为前一天。
    function renderUpdatedDate(lang) {
      var host = document.getElementById("uses-updated");
      var raw = window.USES_UPDATED || "";
      if (!host || !/^\d{4}-\d{2}-\d{2}$/.test(raw)) return;
      var parts = raw.split("-").map(Number);
      var date = new Date(parts[0], parts[1] - 1, parts[2]);
      host.setAttribute("datetime", raw);
      host.textContent = new Intl.DateTimeFormat(lang === "en" ? "en-US" : "zh-CN", {
        year: "numeric",
        month: "short",
        day: "2-digit",
      }).format(date);
    }

    window.renderUses = renderUses;
    renderUses();
  })();
  </script>
<!-- #endregion -->
</body>
</html>
