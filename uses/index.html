<!DOCTYPE html>
<!--
  uses/index.html - 装备页
  协同：assets/js/core/ 中的公共头部、页脚与多语言脚本。
  数据驱动：assets/js/data/uses.js 提供装备、工具与分类，页面脚本只负责筛选和渲染。
-->
<html lang="zh" data-style="magazine" data-scheme="light">
<!-- #region 头部 head（meta / 防闪白脚本 / 样式） -->
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>装备 · magicbude</title>
  <meta name="description" content="magicbude 日常在用的硬件与软件。">

  <script>
    (function () {
      try {
        var s = localStorage.getItem("site-style") || "magazine";
        var l = localStorage.getItem("site-lang") || "zh";
        var scheme = (s === "instrument" || s === "terminal") ? "dark" : "light";
        var d = document.documentElement;
        d.setAttribute("data-style", s);
        d.setAttribute("data-scheme", scheme);
        d.setAttribute("lang", l);
      } catch (e) {}
    })();
  </script>

  <link rel="stylesheet" href="../assets/css/main.css">
<!-- #endregion -->
  <link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
<!-- #region 页面骨架（导航 / 页脚容器 + 内容区块） -->
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="common.skip">跳到主内容</a>

  <header id="site-header" class="site-header"></header>

  <main class="site-main" id="main">
    <section class="hero container container--narrow">
      <p class="page-eyebrow" data-i18n="uses.eyebrow">装备</p>
      <h1 class="hero__name" data-i18n="uses.title">我在用什么</h1>
      <p class="lead" data-i18n="uses.lead">日常使用的硬件、软件与服务，以及选择它们的原因。</p>
    </section>

    <div class="container">
      <!-- #region 我的装备 -->
      <section class="subsection" aria-labelledby="gear-title">
        <h2 class="subsection__title" id="gear-title">
          <span id="gear-title-icon" aria-hidden="true"></span>
          <span data-i18n="uses.gearTitle">我的装备</span>
        </h2>
        <p class="section__intro" data-i18n="uses.gearLead">我实际使用的设备、软件与服务；这部分会随着使用习惯继续更新。</p>
        <div id="uses-root"></div>
      </section>
      <!-- #endregion 我的装备 -->

      <!-- #region 工具箱 -->
      <section class="subsection" aria-labelledby="toolbox-title">
        <h2 class="subsection__title" id="toolbox-title">
          <span id="toolbox-title-icon" aria-hidden="true"></span>
          <span data-i18n="uses.toolboxTitle">工具箱</span>
        </h2>
        <p class="section__intro" data-i18n="uses.toolboxLead">值得收藏的软件与开发工具目录；收录不等于当前正在使用。</p>

        <!--
          筛选按钮由数据中的分类动态生成。使用一个容器监听点击事件，
          即使以后增加分类，也不需要为每个新按钮单独绑定监听器。
        -->
        <div class="toolbox-filters" id="toolbox-filters" aria-label="工具分类"></div>
        <div class="card-grid" id="toolbox-root"></div>
      </section>
      <!-- #endregion 工具箱 -->
    </div>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

<!-- #endregion -->
<!-- #region 脚本（依赖加载 + 本页数据 -> DOM 渲染） -->
  <script src="../assets/js/core/site.config.js"></script>
  <script src="../assets/js/core/icons.js"></script>
  <script src="../assets/js/core/i18n.js"></script>
  <script src="../assets/js/core/main.js"></script>
  <script src="../assets/js/data/uses.js"></script>

  <!--
    装备页「数据 → DOM」：装备按分类进行两层渲染；工具箱先按当前分类筛选，
    再将结果映射为卡片。切换语言时 main.js 会再次调用 window.renderUses。
  -->
  <script>
  (function () {
    "use strict";

    var ICON = window.icon || function () { return ""; };
    var I18N = window.i18n || { t: function (k) { return k; }, getLang: function () { return "zh"; } };
    var activeToolCategory = "all";
    var filtersBound = false;

    // 所有外部数据在插入 innerHTML 前统一转义，避免名称中的特殊字符破坏标签结构。
    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function localized(value, lang) {
      return value && (value[lang] || value.zh || value.en) || "";
    }

    // 有链接的装备用 <a>，纯说明项用 <article>；避免用 href="#" 制造无意义的页面跳动。
    function renderGearCard(item, lang) {
      var tag = item.url ? "a" : "article";
      var attrs = item.url ? ' href="' + escapeHtml(item.url) + '" target="_blank" rel="noopener"' : "";
      return (
        "<" + tag + ' class="card"' + attrs + ">" +
          '<span class="card__title">' + escapeHtml(item.name) + "</span>" +
          '<span class="card__desc">' + escapeHtml(localized(item.note, lang)) + "</span>" +
          (item.url ? '<span class="card__link">' + I18N.t("uses.officialSite") + ICON("external") + "</span>" : "") +
        "</" + tag + ">"
      );
    }

    function renderGear(lang) {
      var root = document.getElementById("uses-root");
      if (!root) return;
      root.innerHTML = (window.USES || []).map(function (category) {
        return (
          '<section class="uses-category">' +
            '<h3 class="uses-category__title">' + ICON(category.icon || "layout") +
              "<span>" + escapeHtml(localized(category.title, lang)) + "</span></h3>" +
            '<div class="card-grid">' + (category.items || []).map(function (item) {
              return renderGearCard(item, lang);
            }).join("") + "</div>" +
          "</section>"
        );
      }).join("");
    }

    function renderToolFilters(lang) {
      var root = document.getElementById("toolbox-filters");
      var categories = window.TOOL_CATEGORIES || {};
      if (!root) return;
      var buttons = '<button class="tag tag-btn' + (activeToolCategory === "all" ? " is-active" : "") +
        '" type="button" data-category="all">' + I18N.t("uses.filterAll") + "</button>";
      buttons += Object.keys(categories).map(function (key) {
        var category = categories[key];
        return '<button class="tag tag-btn' + (activeToolCategory === key ? " is-active" : "") +
          '" type="button" data-category="' + key + '">' +
          ICON(category.icon) + escapeHtml(localized(category.label, lang)) + "</button>";
      }).join("");
      root.innerHTML = buttons;
    }

    function renderToolbox(lang) {
      var root = document.getElementById("toolbox-root");
      var categories = window.TOOL_CATEGORIES || {};
      var tools = window.TOOLBOX || [];
      if (!root) return;
      if (activeToolCategory !== "all") {
        tools = tools.filter(function (tool) { return tool.category === activeToolCategory; });
      }
      root.innerHTML = tools.map(function (tool) {
        var category = categories[tool.category] || { label: {}, icon: "tool" };
        return (
          '<a class="card tool-card" href="' + escapeHtml(tool.url) + '" target="_blank" rel="noopener">' +
            '<span class="card__title">' + ICON(category.icon) + "<span>" + escapeHtml(tool.name) + "</span></span>" +
            '<span class="tag tool-card__category">' + escapeHtml(localized(category.label, lang)) + "</span>" +
            '<span class="card__desc">' + escapeHtml(localized(tool.note, lang)) + "</span>" +
            '<span class="card__link">' + I18N.t("uses.officialSite") + ICON("external") + "</span>" +
          "</a>"
        );
      }).join("");
    }

    function bindToolFilters() {
      var root = document.getElementById("toolbox-filters");
      if (!root || filtersBound) return;
      root.addEventListener("click", function (event) {
        var button = event.target.closest("[data-category]");
        if (!button) return;
        activeToolCategory = button.getAttribute("data-category") || "all";
        renderUses();
      });
      filtersBound = true;
    }

    function renderUses() {
      var lang = I18N.getLang();
      var gearIcon = document.getElementById("gear-title-icon");
      var toolboxIcon = document.getElementById("toolbox-title-icon");
      if (gearIcon) gearIcon.innerHTML = ICON("layout");
      if (toolboxIcon) toolboxIcon.innerHTML = ICON("tool");
      renderGear(lang);
      renderToolFilters(lang);
      renderToolbox(lang);
      bindToolFilters();
    }

    window.renderUses = renderUses;
    renderUses();
  })();
  </script>
<!-- #endregion -->
</body>
</html>
