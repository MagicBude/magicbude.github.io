<!DOCTYPE html>
<!--
  blog.html - 博客列表页
  作用：展示全部文章，支持按语言（全部/中文/English）与标签筛选。
  协同：js/site.config.js（头部 / 页脚）、js/i18n.js（多语）、js/posts.js（文章数据源）。
  数据驱动：文章列表由 window.POSTS（构建脚本生成）经 window.renderBlog 渲染；
            挂到 window.renderBlog，main.js 在切换语言时会重渲染，让筛选标签/文案同步。
-->
<html lang="zh" data-style="instrument" data-scheme="dark">
<!-- #region 头部 head（meta / 防闪白脚本 / 样式） -->
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>博客 · magicbude</title>
  <meta name="description" content="magicbude 的博客：写代码、做小工具的记录，以及一些碎碎念。">

  <!-- 防闪白内联脚本：CSS 加载前先按 localStorage 设皮肤/语言（键名与 main.js / i18n.js 一致） -->
  <script>
    (function () {
      try {
        var s = localStorage.getItem("site-style") || "instrument";
        var l = localStorage.getItem("site-lang") || "zh";
        var scheme = (s === "instrument" || s === "terminal") ? "dark" : "light";
        var d = document.documentElement;
        d.setAttribute("data-style", s);
        d.setAttribute("data-scheme", scheme);
        d.setAttribute("lang", l);
      } catch (e) {}
    })();
  </script>

  <link rel="stylesheet" href="css/main.css">
<!-- #endregion -->
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
<!-- #region 页面骨架（导航 / 页脚容器 + 内容区块） -->
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="common.skip">跳到主内容</a>

  <!-- 头部容器：js/main.js 根据 site.config.js 注入导航（数据驱动，不写死） -->
  <header id="site-header" class="site-header"></header>

  <main class="site-main" id="main">
    <!-- ============ 页面引言 ============ -->
    <section class="hero container container--narrow">
      <p class="page-eyebrow" data-i18n="blog.eyebrow">博客</p>
      <h1 class="hero__name" data-i18n="blog.title">博客</h1>
      <p class="lead" data-i18n="blog.lead">写代码、做小工具的记录，以及一些碎碎念。</p>
    </section>

    <!-- ============ 筛选栏 + 文章列表 ============ -->
    <section class="section container">
      <!-- 筛选栏：语言 + 标签。点击 chip 即筛选，由本页脚本处理（事件委托） -->
      <div class="blog-filters" id="blog-filters">
        <div class="blog-filters__group">
          <span class="blog-filters__label" data-i18n="blog.filterLang">语言</span>
          <button type="button" class="tag tag-btn is-active" data-type="lang" data-value="all" data-i18n="common.all">全部</button>
          <button type="button" class="tag tag-btn" data-type="lang" data-value="zh" data-i18n="blog.langZh">中文</button>
          <button type="button" class="tag tag-btn" data-type="lang" data-value="en" data-i18n="blog.langEn">English</button>
        </div>
        <div class="blog-filters__group" id="tag-group">
          <span class="blog-filters__label" data-i18n="blog.filterTag">标签</span>
          <!-- 标签 chip 由脚本按文章数据动态生成 -->
        </div>
      </div>

      <!-- 文章列表：由 renderBlog 根据 window.POSTS 生成 -->
      <div class="post-list" id="blog-list"></div>
      <!-- 空态：筛选后没有任何文章时显示 -->
      <p class="empty-state" id="blog-empty" hidden data-i18n="blog.empty">没有匹配的文章。</p>
    </section>
  </main>

  <!-- 页脚容器：js/main.js 注入（版权 + 社交链接） -->
  <footer id="site-footer" class="site-footer"></footer>

<!-- #endregion -->
<!-- #region 脚本（依赖加载 + 本页数据 -> DOM 渲染） -->
  <!-- 脚本顺序：配置 → 图标 → 多语 → 文章数据 → 主逻辑 -->
  <script src="js/site.config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/posts.js"></script>
  <script src="js/main.js"></script>

  <!--
    博客列表「数据 → DOM」渲染脚本。
    - window.POSTS 由 tools/build.mjs 生成（js/posts.js），里面是文章数组。
    - 渲染 + 筛选（语言 / 标签）全部在前端完成，零后端。
    - 挂到 window.renderBlog：main.js 切语言时会调用，让筛选标签与卡片文案跟着变语言。
  -->
  <script>
  (function () {
    "use strict";

    var ICON  = window.icon || function () { return ""; };
    var I18N  = window.i18n || { t: function (k) { return k; }, getLang: function () { return "zh"; }, apply: function () {} };

    // 筛选状态：语言（all/zh/en）与标签（all 或具体标签名）。
    // 注意：这是「文章语言」筛选，和界面 UI 语言是两回事，互不影响。
    var langFilter = "all";
    var tagFilter = "all";

    // 文本转义：文章标题/摘要/标签都可能含特殊字符，必须转义后再拼进 HTML。
    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;")
        .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    // 渲染整个博客列表 + 筛选栏。幂等，可反复调用。
    function renderBlog() {
      var list = window.POSTS || [];

      // ---- 1) 汇总所有出现过的标签，生成标签筛选 chip ----
      var tagSet = {};
      list.forEach(function (p) {
        (p.tags || []).forEach(function (t) { tagSet[t] = 1; });
      });
      var tags = Object.keys(tagSet);

      var tagGroup = document.getElementById("tag-group");
      if (tagGroup) {
        var label = tagGroup.querySelector(".blog-filters__label");
        var chips = "";
        // 「全部」始终在第一个；带 data-i18n 让它跟随界面语言。
        chips += '<button type="button" class="tag tag-btn' +
          (tagFilter === "all" ? " is-active" : "") +
          '" data-type="tag" data-value="all" data-i18n="common.all">全部</button>';
        chips += tags.map(function (t) {
          return '<button type="button" class="tag tag-btn' +
            (tagFilter === t ? " is-active" : "") +
            '" data-type="tag" data-value="' + escapeHtml(t) + '">' +
            escapeHtml(t) + "</button>";
        }).join("");
        // 保留分组标题，再追加 chip。
        tagGroup.innerHTML = "";
        if (label) tagGroup.appendChild(label);
        tagGroup.insertAdjacentHTML("beforeend", chips);
        // 新插入的 chip 带 data-i18n，补一次翻译。
        I18N.apply(tagGroup);
      }

      // ---- 2) 按筛选条件过滤 ----
      var filtered = list.filter(function (p) {
        if (langFilter !== "all" && p.lang !== langFilter) return false;
        if (tagFilter !== "all" && (p.tags || []).indexOf(tagFilter) === -1) return false;
        return true;
      });

      var host = document.getElementById("blog-list");
      if (!host) return;

      var empty = document.getElementById("blog-empty");
      if (filtered.length === 0) {
        host.innerHTML = "";
        if (empty) empty.hidden = false;
        return;
      }
      if (empty) empty.hidden = true;

      // ---- 3) 渲染卡片列表（复用 .post-list / .post-item，与首页「最新动态」一致）----
      host.innerHTML = filtered.map(function (p) {
        var d = p.date ? String(p.date).slice(0, 10) : "";
        var langLabel = p.lang === "en" ? "EN" : "中";
        var tagsHtml = (p.tags || []).map(function (t) {
          return '<span class="tag">' + escapeHtml(t) + "</span>";
        }).join(" ");
        return (
          '<a class="post-item" href="' + p.url + '">' +
            '<div class="post-item__title">' + escapeHtml(p.title) + "</div>" +
            (p.excerpt ? '<p class="post-item__excerpt">' + escapeHtml(p.excerpt) + "</p>" : "") +
            '<div class="post-meta">' +
              '<span class="post-meta__item">' + ICON("book") + d + "</span>" +
              '<span class="post-meta__item">' + langLabel + "</span>" +
              (tagsHtml ? '<span class="post-meta__item">' + tagsHtml + "</span>" : "") +
            "</div>" +
          "</a>"
        );
      }).join("");
    }

    // 筛选点击：事件委托，挂在容器上（chip 是动态生成的，委托最稳）。
    function bindFilters() {
      var root = document.getElementById("blog-filters");
      if (!root || root.dataset.bound) return;
      root.dataset.bound = "1";
      root.addEventListener("click", function (e) {
        var btn = e.target.closest(".tag-btn");
        if (!btn) return;
        var type = btn.getAttribute("data-type");
        var val = btn.getAttribute("data-value");
        if (type === "lang") langFilter = val;
        else if (type === "tag") tagFilter = val;
        renderBlog();
      });
    }

    // 暴露给 main.js 的语言切换钩子，并立即渲染一次。
    window.renderBlog = renderBlog;
    renderBlog();
    bindFilters();
  })();
  </script>
<!-- #endregion -->
</body>
</html>
