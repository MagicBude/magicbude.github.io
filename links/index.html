<!DOCTYPE html>
<!--
  links/index.html - 导航 / 友链页
  协同：assets/js/core/ 公共脚本与 assets/js/data/links.js 共享链接数据。
  数据驱动：两类链接由 window.LINKS 经 window.renderLinks 渲染（friends / resources）。
-->
<html lang="zh" data-style="magazine" data-scheme="light">
<!-- #region 头部 head（meta / 防闪白脚本 / 样式） -->
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>导航 · magicbude</title>
  <meta name="description" content="magicbude 的朋友站点与日常好用的资源/工具。">

  <script>
    (function () {
      try {
        var s = localStorage.getItem("site-style") || "magazine";
        var l = localStorage.getItem("site-lang") || "zh";
        var scheme = (s === "instrument" || s === "terminal") ? "dark" : "light";
        var d = document.documentElement;
        d.setAttribute("data-style", s);
        d.setAttribute("data-scheme", scheme);
        d.setAttribute("lang", l);
      } catch (e) {}
    })();
  </script>

  <link rel="stylesheet" href="../assets/css/main.css">
<!-- #endregion -->
  <link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
<!-- #region 页面骨架（导航 / 页脚容器 + 内容区块） -->
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="common.skip">跳到主内容</a>

  <header id="site-header" class="site-header"></header>

  <main class="site-main" id="main">
    <section class="hero container container--narrow">
      <p class="page-eyebrow" data-i18n="links.eyebrow">导航</p>
      <h1 class="hero__name" data-i18n="links.title">朋友们和好站</h1>
      <p class="lead" data-i18n="links.lead">我常逛、或觉得有用的地方；也欢迎交换友链。</p>
    </section>

    <!-- 两类链接由 renderLinks 按 window.LINKS 生成 -->
    <div class="container" id="links-root"></div>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

<!-- #endregion -->
<!-- #region 脚本（依赖加载 + 本页数据 -> DOM 渲染） -->
  <script src="../assets/js/core/site.config.js"></script>
  <script src="../assets/js/core/icons.js"></script>
  <script src="../assets/js/core/i18n.js"></script>
  <!-- 链接数据独立加载，使导航页和搜索页可以共享同一份 window.LINKS。 -->
  <script src="../assets/js/data/links.js"></script>
  <script src="../assets/js/core/main.js"></script>

  <!--
    导航页「数据 → DOM」。数据分两类：friends（朋友站点）/ resources（资源工具）。
    结构上和装备页一样是「按分组渲染卡片网格」，只是分组是固定的两类，
    所以这里直接写两个 subsection，而不是循环一个分类数组。
  -->
  <script>
  (function () {
    "use strict";

    var ICON = window.icon || function () { return ""; };
    var I18N = window.i18n || { t: function (k) { return k; }, getLang: function () { return "zh"; } };

    // 把一组链接渲染成「标题 + 卡片网格」。friends/resources 复用它。
    function renderGroup(titleText, items) {
      var cards = (items || []).map(function (it) {
        var note = (it.note && it.note[I18N.getLang()]) ? it.note[I18N.getLang()] : (it.note && it.note.zh) || "";
        return (
          '<a class="card card--link" href="' + it.url + '" target="_blank" rel="noopener">' +
            '<span class="card__title"><span>' + it.name + "</span></span>" +
            '<span class="card__desc">' + note + "</span>" +
            '<span class="card__link ml-auto">' + I18N.t("projects.view") + ICON("external") + "</span>" +
          "</a>"
        );
      }).join("");
      return (
        '<section class="subsection">' +
          '<h2 class="subsection__title">' + ICON("link") + "<span>" + titleText + "</span></h2>" +
          '<div class="card-grid">' + cards + "</div>" +
        "</section>"
      );
    }

    function renderLinks() {
      var root = document.getElementById("links-root");
      if (!root) return;
      var data = window.LINKS || {};
      var html =
        renderGroup(I18N.t("links.friend"), data.friends) +
        renderGroup(I18N.t("links.resource"), data.resources);
      root.innerHTML = html;
    }

    window.renderLinks = renderLinks;
    renderLinks();
  })();
  </script>
<!-- #endregion -->
</body>
</html>
