<!DOCTYPE html>
<!--
  links/index.html - 收藏与友链页
  协同：assets/js/core/ 公共脚本与 assets/js/data/links.js 共享链接数据。
  数据驱动：window.LINKS 提供友链、网站与工具收藏，window.LINK_CATEGORIES 提供资源类型；
  页面还从 SITE_CONFIG 读取公开邮箱，避免在多个页面重复维护联系方式。
-->
<html lang="zh" data-style="magazine" data-scheme="light">
<!-- #region 头部 head（meta / 防闪白脚本 / 样式） -->
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>收藏 · magicbude</title>
  <meta name="description" content="magicbude 的跨设备收藏夹：常用网站、软件工具、参考资料与朋友站点。">

  <script>
    (function () {
      try {
        var s = localStorage.getItem("site-style") || "magazine";
        var l = localStorage.getItem("site-lang") || "zh";
        var scheme = (s === "instrument" || s === "terminal") ? "dark" : "light";
        var d = document.documentElement;
        d.setAttribute("data-style", s);
        d.setAttribute("data-scheme", scheme);
        d.setAttribute("lang", l);
      } catch (e) {}
    })();
  </script>

  <link rel="stylesheet" href="../assets/css/main.css">
<!-- #endregion -->
  <link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
<!-- #region 页面骨架（导航 / 页脚容器 + 内容区块） -->
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="common.skip">跳到主内容</a>

  <header id="site-header" class="site-header"></header>

  <main class="site-main" id="main">
    <!-- #region 导航引言与链接摘要 -->
    <section class="hero container links-hero">
      <div class="links-hero__copy">
        <p class="page-eyebrow" data-i18n="links.eyebrow">个人收藏</p>
        <h1 class="hero__name" data-i18n="links.title">网站与工具收藏夹</h1>
        <p class="lead" data-i18n="links.lead">把常用网站、软件工具、参考资料和朋友站点收在一起，换一台设备也能快速找回来。</p>
      </div>

      <!-- 数字由 links.js 的数组长度计算，新增收藏后无需手工同步。 -->
      <aside class="links-index" aria-labelledby="links-index-title">
        <p class="links-index__kicker" id="links-index-title" data-i18n="links.snapshot.kicker">BOOKMARK LIBRARY</p>
        <div class="links-index__date"><span data-i18n="links.updated">最后核对</span><time id="links-updated" datetime="2026-08-18">2026.08.18</time></div>
        <dl class="links-index__stats">
          <div><dt data-i18n="links.friendsCount">公开友链</dt><dd id="links-friends-count">0</dd></div>
          <div><dt data-i18n="links.resourcesCount">收藏条目</dt><dd id="links-resources-count">0</dd></div>
        </dl>
      </aside>
    </section>
    <!-- #endregion 导航引言与链接摘要 -->

    <!-- #region 朋友与资源列表 -->
    <div class="container links-content" id="links-root"></div>
    <noscript>
      <div class="container empty-state">本站导航需要 JavaScript 读取本地链接数据。</div>
    </noscript>
    <!-- #endregion 朋友与资源列表 -->
  </main>

  <footer id="site-footer" class="site-footer"></footer>

<!-- #endregion -->
<!-- #region 脚本（依赖加载 + 本页数据 -> DOM 渲染） -->
  <script src="../assets/js/core/site.config.js"></script>
  <script src="../assets/js/core/icons.js"></script>
  <script src="../assets/js/core/i18n.js"></script>
  <!-- 链接数据独立加载，使收藏页和搜索页可以共享同一份 window.LINKS。 -->
  <script src="../assets/js/data/links.js"></script>
  <script src="../assets/js/core/main.js"></script>

  <!--
    收藏页「数据 → DOM」。friends 为空时生成交换入口，resources 生成编号收藏档案；
    语言切换由 main.js 再次调用 window.renderLinks，并同步日期、分类和说明。
  -->
  <script>
  (function () {
    "use strict";

    var ICON = window.icon || function () { return ""; };
    var I18N = window.i18n || { t: function (k) { return k; }, getLang: function () { return "zh"; } };
    var activeCategory = "all";
    var filtersBound = false;

    function escapeHtml(value) {
      return String(value == null ? "" : value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function localized(value, lang) {
      return value && (value[lang] || value.zh || value.en) || "";
    }

    function renderHeading(index, titleKey, leadKey) {
      return (
        '<header class="links-section__heading"><p class="links-section__index">0' + index + "</p><div>" +
          "<h2>" + escapeHtml(I18N.t(titleKey)) + "</h2>" +
          "<p>" + escapeHtml(I18N.t(leadKey)) + "</p>" +
        "</div></header>"
      );
    }

    // 邮箱来自 SITE_CONFIG 的公开社交数据；没有邮箱时不渲染无效按钮。
    function getPublicEmail() {
      var social = (window.SITE_CONFIG && window.SITE_CONFIG.social) || [];
      var entry = social.find(function (item) { return item.type === "mail" && /^mailto:/.test(item.url || ""); });
      return entry ? entry.url : "";
    }

    function renderFriends(items) {
      var lang = I18N.getLang();
      var content = "";
      if (!items.length) {
        var email = getPublicEmail();
        content = '<div class="links-empty"><span class="links-empty__icon">' + ICON("link") + "</span>" +
          '<p class="links-empty__title">' + escapeHtml(I18N.t("links.empty")) + "</p>" +
          '<p class="links-empty__lead">' + escapeHtml(I18N.t("links.emptyLead")) + "</p>" +
          (email ? '<a class="btn btn--ghost links-empty__action" href="' + escapeHtml(email) + '">' +
            ICON("mail") + escapeHtml(I18N.t("links.contact")) + "</a>" : "") + "</div>";
      } else {
        content = '<div class="links-friends">' + items.map(function (item) {
          return '<a class="links-friend-card" href="' + escapeHtml(item.url) + '" target="_blank" rel="noopener">' +
            '<h3>' + escapeHtml(item.name) + "</h3><p>" + escapeHtml(localized(item.note, lang)) + "</p>" +
            '<span>' + escapeHtml(I18N.t("links.visit")) + ICON("external") + "</span></a>";
        }).join("") + "</div>";
      }
      return '<section class="links-section">' + renderHeading(1, "links.friend", "links.friendLead") + content + "</section>";
    }

    function renderResources(items) {
      var lang = I18N.getLang();
      var categories = window.LINK_CATEGORIES || {};
      var availableCategories = Object.keys(categories).filter(function (key) {
        return items.some(function (item) { return item.category === key; });
      });
      var visibleItems = activeCategory === "all" ? items : items.filter(function (item) {
        return item.category === activeCategory;
      });

      // 分类按钮只显示真实存在的分类，并把数量放在按钮内，切换前就能判断内容规模。
      var filterItems = [{ key: "all", label: I18N.t("links.filterAll"), icon: "layout", count: items.length }]
        .concat(availableCategories.map(function (key) {
          return {
            key: key,
            label: localized(categories[key].label, lang),
            icon: categories[key].icon,
            count: items.filter(function (item) { return item.category === key; }).length,
          };
        }));
      var filters = '<div class="links-library__toolbar">' +
        '<div class="links-filters" aria-label="' + escapeHtml(I18N.t("links.filtersLabel")) + '">' +
          filterItems.map(function (filter) {
            return '<button class="links-filter' + (filter.key === activeCategory ? " is-active" : "") +
              '" type="button" data-link-category="' + escapeHtml(filter.key) + '" aria-pressed="' +
              (filter.key === activeCategory) + '">' + ICON(filter.icon) + '<span>' + escapeHtml(filter.label) +
              '</span><span class="links-filter__count">' + filter.count + "</span></button>";
          }).join("") +
        '</div><p class="links-library__status" aria-live="polite">' +
          escapeHtml(I18N.t("links.showing").replace("{n}", visibleItems.length)) + "</p></div>";

      var cards = visibleItems.map(function (item, index) {
        var category = categories[item.category] || { label: {}, icon: "link" };
        return '<a class="links-resource" href="' + escapeHtml(item.url) + '" target="_blank" rel="noopener">' +
          '<span class="links-resource__number">' + String(index + 1).padStart(2, "0") + "</span>" +
          '<span class="links-resource__body"><span class="links-resource__category">' + ICON(category.icon) +
            escapeHtml(localized(category.label, lang)) + "</span><strong>" + escapeHtml(item.name) +
            "</strong><span>" + escapeHtml(localized(item.note, lang)) + "</span></span>" +
          '<span class="links-resource__visit">' + escapeHtml(I18N.t("links.visit")) + ICON("arrowRight") + "</span>" +
        "</a>";
      }).join("");
      return '<section class="links-section">' + renderHeading(2, "links.resource", "links.resourceLead") +
        filters + '<div class="links-resources">' + cards + "</div></section>";
    }

    // 手工核对日期使用本地年月日，避免 ISO 日期在部分时区显示成前一天。
    function renderUpdatedDate(lang) {
      var host = document.getElementById("links-updated");
      var raw = window.LINKS_UPDATED || "";
      if (!host || !/^\d{4}-\d{2}-\d{2}$/.test(raw)) return;
      var parts = raw.split("-").map(Number);
      var date = new Date(parts[0], parts[1] - 1, parts[2]);
      host.setAttribute("datetime", raw);
      host.textContent = new Intl.DateTimeFormat(lang === "en" ? "en-US" : "zh-CN", {
        year: "numeric", month: "short", day: "2-digit",
      }).format(date);
    }

    function renderLinks() {
      var root = document.getElementById("links-root");
      if (!root) return;
      var data = window.LINKS || {};
      var friends = data.friends || [];
      var resources = data.resources || [];
      var friendsCount = document.getElementById("links-friends-count");
      var resourcesCount = document.getElementById("links-resources-count");
      if (friendsCount) friendsCount.textContent = friends.length;
      if (resourcesCount) resourcesCount.textContent = resources.length;
      renderUpdatedDate(I18N.getLang());
      root.innerHTML = renderFriends(friends) + renderResources(resources);
    }

    // 事件委托只绑定一次；重绘筛选按钮后无需逐个重新绑定监听器。
    function bindFilters() {
      var root = document.getElementById("links-root");
      if (!root || filtersBound) return;
      root.addEventListener("click", function (event) {
        var button = event.target.closest("[data-link-category]");
        if (!button) return;
        activeCategory = button.getAttribute("data-link-category") || "all";
        renderLinks();
      });
      filtersBound = true;
    }

    window.renderLinks = function () { bindFilters(); renderLinks(); };
    bindFilters();
    renderLinks();
  })();
  </script>
<!-- #endregion -->
</body>
</html>
