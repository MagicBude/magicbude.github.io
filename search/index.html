<!DOCTYPE html>
<!--
  search/index.html - 站内搜索页
  协同：assets/js/core/ 公共脚本，以及文章、项目、收藏三类共享数据文件。
  数据驱动：页面把导航与共享数据归一为本地 INDEX，支持关键词、类型筛选与分组渲染；
  所有搜索都在浏览器内完成，不向外部服务发送输入内容。
-->
<html lang="zh" data-style="magazine" data-scheme="light">
<!-- #region 头部 head（meta / 防闪白脚本 / 样式） -->
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>搜索 · magicbude</title>
  <meta name="description" content="在浏览器本地搜索 magicbude 的页面、文章、项目、资源与参考工具。">

  <script>
    (function () {
      try {
        var s = localStorage.getItem("site-style") || "magazine";
        var l = localStorage.getItem("site-lang") || "zh";
        var scheme = (s === "instrument" || s === "terminal") ? "dark" : "light";
        var d = document.documentElement;
        d.setAttribute("data-style", s);
        d.setAttribute("data-scheme", scheme);
        d.setAttribute("lang", l);
      } catch (e) {}
    })();
  </script>

  <link rel="stylesheet" href="../assets/css/main.css">
<!-- #endregion -->
  <link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
<!-- #region 页面骨架（导航 / 页脚容器 + 内容区块） -->
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="common.skip">跳到主内容</a>

  <header id="site-header" class="site-header"></header>

  <main class="site-main" id="main">
    <!-- #region 搜索引言与索引摘要 -->
    <section class="hero container search-hero">
      <div class="search-hero__copy">
        <p class="page-eyebrow" data-i18n="search.eyebrow">全站索引</p>
        <h1 class="hero__name" data-i18n="search.title">搜索这座数字基地</h1>
        <p class="lead" data-i18n="search.lead">从页面、文章、项目、资源和工具中查找内容，也可以不输入关键词，直接按类型浏览。</p>
      </div>

      <!-- 索引数量由共享数据实时计算，避免内容增加后手写数字失真。 -->
      <aside class="search-index" aria-labelledby="search-index-title">
        <p class="search-index__kicker" id="search-index-title" data-i18n="search.snapshot.kicker">LOCAL INDEX</p>
        <dl class="search-index__stats">
          <div><dt data-i18n="search.items">索引条目</dt><dd id="search-item-count">0</dd></div>
          <div><dt data-i18n="search.sources">内容类型</dt><dd id="search-kind-count">0</dd></div>
        </dl>
      </aside>
    </section>
    <!-- #endregion 搜索引言与索引摘要 -->

    <!-- #region 查询控件与结果索引 -->
    <section class="section container search-workspace">
      <div class="search-console">
        <label class="sr-only" for="search-input" data-i18n="search.label">搜索关键词</label>
        <span class="search-console__icon" id="search-icon" aria-hidden="true"></span>
        <input
          id="search-input"
          class="search-input"
          type="search"
          autocomplete="off"
          data-i18n="common.searchPlaceholder"
          data-i18n-attr="placeholder,aria-label"
          placeholder="搜索站内内容…"
          aria-label="搜索">
        <span class="search-console__shortcut" data-i18n="search.shortcut">按 / 聚焦</span>
        <button class="search-console__clear" id="search-clear" type="button" hidden data-i18n="search.clear" data-i18n-attr="aria-label">清空搜索</button>
      </div>

      <!-- 类型按钮由 INDEX 统计生成，aria-pressed 表达当前选中状态。 -->
      <div class="search-toolbar">
        <div class="search-filters" id="search-filters" data-i18n="search.filtersLabel" data-i18n-attr="aria-label" aria-label="按内容类型筛选"></div>
        <p class="search-stats" id="search-stats" aria-live="polite"></p>
      </div>

      <!-- 结果按内容类型分组；空查询时就是完整站点地图。 -->
      <div class="search-groups" id="search-results"></div>
      <div class="search-empty" id="search-empty" hidden>
        <span aria-hidden="true" id="search-empty-icon"></span>
        <p class="search-empty__title" data-i18n="search.empty">没有匹配的内容，换个关键词试试。</p>
        <p class="search-empty__lead" data-i18n="search.emptyLead">可以清空关键词，或者切回“全部”查看完整索引。</p>
      </div>
    </section>
    <!-- #endregion 查询控件与结果索引 -->
  </main>

  <footer id="site-footer" class="site-footer"></footer>

<!-- #endregion -->
<!-- #region 脚本（依赖加载 + 本页数据 -> DOM 渲染） -->
  <script src="../assets/js/core/site.config.js"></script>
  <script src="../assets/js/core/icons.js"></script>
  <script src="../assets/js/core/i18n.js"></script>
  <!-- posts.js 必须先于本页搜索脚本加载，否则文章不会进入 window.POSTS。 -->
  <script src="../assets/js/data/posts.js"></script>
  <!-- 项目与链接数据同样先加载，搜索页才能读取对应的全局数据。 -->
  <script src="../assets/js/data/projects.js"></script>
  <script src="../assets/js/data/links.js"></script>
  <script src="../assets/js/core/main.js"></script>

  <!--
    搜索页「异构数据 → 本地索引 → 类型筛选 / 关键词过滤 → 分组结果」。
    索引同时保存当前语言展示字段和中英双语搜索文本，所以中文界面也能搜英文项目名；
    所有过滤都在浏览器内完成，输入内容不会离开访客设备。
    这是「把异构数据先归一、再做统一处理」的常见前端套路，值得记住。
  -->
  <script>
  (function () {
    "use strict";

    var ICON = window.icon || function () { return ""; };
    var I18N = window.i18n || { t: function (k) { return k; }, getLang: function () { return "zh"; } };
    var CONFIG = window.SITE_CONFIG || {};

    var KIND_ORDER = ["page", "blog", "project", "link", "tool"];
    var KIND_ICON = { page: "layout", blog: "book", project: "code", link: "link", tool: "tool" };
    var INDEX = [];
    var activeKind = "all";
    var bound = false;

    // 把任意字符串安全地转小写（防止 null/undefined 报错）
    function lc(s) { return (s || "").toString().toLowerCase(); }

    // 从双语对象中读取当前语言；普通字符串也直接返回，兼容文章标题等旧数据。
    function bi(field) {
      var lang = I18N.getLang();
      if (typeof field === "string") return field;
      return (field && field[lang]) ? field[lang] : (field && field.zh) || (field && field.en) || "";
    }

    // 搜索文本同时收纳中英内容，不让界面语言限制访客能找到什么。
    function bilingualText(field) {
      if (typeof field === "string") return field;
      if (!field) return "";
      return [field.zh, field.en].filter(Boolean).join(" ");
    }

    /*
     * 搜索结果最终通过 innerHTML 批量插入，因此标题、摘要和 URL 必须先转义。
     * 即使当前数据由自己维护，也不能让一篇文章标题中的引号破坏 HTML 属性；
     * 把安全边界放在渲染出口，比要求每个数据源自行转义更可靠。
     */
    function escapeHtml(value) {
      return String(value == null ? "" : value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    // 外部网址与邮箱协议保持原样；其余路径统一从站点根目录解析。
    // 这样搜索结果不受当前页面目录深度影响，也兼容线上部署与本地双击预览。
    function resolveUrl(url) {
      return /^(?:[a-z]+:|\/\/)/i.test(url) ? url : window.siteUrl(url);
    }

    function isExternalUrl(url) {
      return /^(?:https?:|mailto:|\/\/)/i.test(url || "");
    }

    // 建索引：所有来源归一为 title / excerpt / meta / kind / searchText。
    function buildIndex() {
      var items = [];

      // 1) 站内页面（来自导航配置）
      (CONFIG.nav || []).forEach(function (n) {
        // 搜索页自身不进索引，避免自己搜自己。
        if (n.key === "search") return;
        items.push({
          title: I18N.t(n.i18n),
          url: n.href,
          excerpt: CONFIG.name || "magicbude",
          meta: n.href,
          kind: "page",
          searchText: [I18N.t(n.i18n), n.key, n.href].join(" "),
        });
      });

      // 2) 博客文章（仅写文章时由小型构建脚本刷新 window.POSTS；没有就跳过）
      (window.POSTS || []).forEach(function (p) {
        items.push({
          title: p.title || "",
          url: p.url || "",
          excerpt: p.excerpt || "",
          meta: [p.date, (p.tags || []).join(" · ")].filter(Boolean).join(" · "),
          kind: "blog",
          searchText: [p.title, p.excerpt, p.summary, (p.tags || []).join(" ")].join(" "),
        });
      });

      // 3) 项目（由共享项目数据文件提供，项目页与搜索页共用）
      (window.PROJECTS || []).forEach(function (p) {
        items.push({
          title: bi(p.title),
          url: p.url || "",
          excerpt: bi(p.desc),
          meta: [I18N.t("projects.status." + p.status), (p.tags || []).join(" · ")].filter(Boolean).join(" · "),
          kind: "project",
          searchText: [bilingualText(p.title), bilingualText(p.desc), (p.tags || []).join(" "), p.status].join(" "),
        });
      });

      // 4) 友链、网站与工具收藏（由共享链接数据文件提供，收藏页与搜索页共用）
      var links = window.LINKS || {};
      ["friends", "resources"].forEach(function (group) {
        (links[group] || []).forEach(function (link) {
          items.push({
            title: link.name || "",
            url: link.url || "",
            excerpt: bi(link.note),
            meta: link.url || "",
            kind: link.kind === "tool" ? "tool" : "link",
            searchText: [link.name, bilingualText(link.note), link.category].join(" "),
          });
        });
      });

      INDEX = items;
    }

    function countByKind(kind) {
      return INDEX.filter(function (item) { return item.kind === kind; }).length;
    }

    function renderSummary() {
      var itemCount = document.getElementById("search-item-count");
      var kindCount = document.getElementById("search-kind-count");
      if (itemCount) itemCount.textContent = INDEX.length;
      if (kindCount) kindCount.textContent = KIND_ORDER.filter(function (kind) { return countByKind(kind) > 0; }).length;
    }

    function renderFilters() {
      var root = document.getElementById("search-filters");
      if (!root) return;
      var buttons = [{ key: "all", count: INDEX.length }].concat(KIND_ORDER.map(function (kind) {
        return { key: kind, count: countByKind(kind) };
      }).filter(function (item) { return item.count > 0; }));
      root.innerHTML = buttons.map(function (item) {
        var label = item.key === "all" ? I18N.t("search.filterAll") : I18N.t("search.kind." + item.key);
        var icon = item.key === "all" ? "search" : KIND_ICON[item.key];
        return '<button class="search-filter' + (activeKind === item.key ? " is-active" : "") +
          '" type="button" data-kind="' + item.key + '" aria-pressed="' + (activeKind === item.key) + '">' +
          ICON(icon) + '<span>' + escapeHtml(label) + '</span><span class="search-filter__count">' + item.count + "</span></button>";
      }).join("");
    }

    function renderResult(item, index) {
      var external = isExternalUrl(item.url);
      var attrs = external ? ' target="_blank" rel="noopener"' : "";
      return '<a class="search-result" href="' + escapeHtml(resolveUrl(item.url)) + '"' + attrs + ">" +
        '<span class="search-result__index">' + String(index + 1).padStart(2, "0") + "</span>" +
        '<span class="search-result__body"><strong>' + escapeHtml(item.title) + "</strong>" +
          '<span class="search-result__excerpt">' + escapeHtml(item.excerpt) + "</span>" +
          '<span class="search-result__meta">' + escapeHtml(item.meta) + "</span></span>" +
        '<span class="search-result__action">' + escapeHtml(I18N.t("search.open")) + ICON(external ? "external" : "arrowRight") + "</span>" +
      "</a>";
    }

    function renderGroup(kind, items) {
      var countKey = items.length === 1 ? "search.groupItem" : "search.groupCount";
      return '<section class="search-group">' +
        '<header class="search-group__heading"><span class="search-group__icon">' + ICON(KIND_ICON[kind]) + "</span>" +
          '<h2>' + escapeHtml(I18N.t("search.kind." + kind)) + "</h2>" +
          '<span>' + escapeHtml(I18N.t(countKey).replace("{n}", items.length)) + "</span></header>" +
        '<div class="search-group__list">' + items.map(renderResult).join("") + "</div></section>";
    }

    // 先按类型、再按关键词过滤；空查询保留完整索引，承担站点地图角色。
    function renderSearch() {
      buildIndex();
      var input = document.getElementById("search-input");
      var q = lc(input && input.value).trim();
      var results = document.getElementById("search-results");
      var empty = document.getElementById("search-empty");
      var stats = document.getElementById("search-stats");
      var clear = document.getElementById("search-clear");
      if (!results) return;

      var hits = INDEX.filter(function (item) {
        var kindMatches = activeKind === "all" || item.kind === activeKind;
        var queryMatches = !q || lc([item.title, item.excerpt, item.meta, item.searchText, item.kind].join(" ")).indexOf(q) >= 0;
        return kindMatches && queryMatches;
      });

      renderSummary();
      renderFilters();
      if (clear) clear.hidden = !q;
      if (stats) stats.textContent = I18N.t(q || activeKind !== "all" ? "search.results" : "search.browse").replace("{n}", hits.length);

      if (!hits.length) {
        results.innerHTML = "";
        if (empty) empty.hidden = false;
        return;
      }
      if (empty) empty.hidden = true;

      results.innerHTML = KIND_ORDER.map(function (kind) {
        var group = hits.filter(function (item) { return item.kind === kind; });
        return group.length ? renderGroup(kind, group) : "";
      }).join("");
    }

    function clearSearch() {
      var input = document.getElementById("search-input");
      if (!input) return;
      input.value = "";
      input.focus();
      renderSearch();
    }

    // 事件只绑定一次；语言切换只重建文本，不会叠加监听器。
    function bindOnce() {
      if (bound) return;
      var input = document.getElementById("search-input");
      var iconHost = document.getElementById("search-icon");
      var emptyIcon = document.getElementById("search-empty-icon");
      var filters = document.getElementById("search-filters");
      var clear = document.getElementById("search-clear");
      if (iconHost) iconHost.innerHTML = ICON("search");
      if (emptyIcon) emptyIcon.innerHTML = ICON("search");
      if (!input) return;

      input.addEventListener("input", renderSearch);
      if (clear) clear.addEventListener("click", clearSearch);
      if (filters) filters.addEventListener("click", function (event) {
        var button = event.target.closest("[data-kind]");
        if (!button) return;
        activeKind = button.getAttribute("data-kind") || "all";
        renderSearch();
      });
      document.addEventListener("keydown", function (event) {
        var target = event.target;
        var isTyping = target && /^(INPUT|TEXTAREA|SELECT)$/.test(target.tagName);
        if (event.key === "/" && !isTyping && !event.metaKey && !event.ctrlKey && !event.altKey) {
          event.preventDefault();
          input.focus();
        }
        if (event.key === "Escape" && document.activeElement === input && input.value) clearSearch();
      });
      bound = true;
    }

    // 暴露给 main.js 的语言切换钩子
    window.renderSearch = function () { bindOnce(); renderSearch(); };

    // 允许以后用 /search/?q=关键词 分享查询；没有参数时保持完整索引。
    var initialQuery = new URLSearchParams(window.location.search).get("q");
    if (initialQuery) document.getElementById("search-input").value = initialQuery;

    bindOnce();
    renderSearch();
  })();
  </script>
<!-- #endregion -->
</body>
</html>
