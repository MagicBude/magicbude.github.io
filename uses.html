<!DOCTYPE html>
<html lang="zh" data-style="instrument" data-scheme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>装备 · magicbude</title>
  <meta name="description" content="magicbude 日常在用的硬件与软件。">

  <script>
    (function () {
      try {
        var s = localStorage.getItem("site-style") || "instrument";
        var l = localStorage.getItem("site-lang") || "zh";
        var scheme = (s === "instrument" || s === "terminal") ? "dark" : "light";
        var d = document.documentElement;
        d.setAttribute("data-style", s);
        d.setAttribute("data-scheme", scheme);
        d.setAttribute("lang", l);
      } catch (e) {}
    })();
  </script>

  <link rel="stylesheet" href="css/main.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d1117'/%3E%3Crect x='9' y='9' width='14' height='14' rx='4' fill='%234aa8ff'/%3E%3C/svg%3E">
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="common.skip">跳到主内容</a>

  <header id="site-header" class="site-header"></header>

  <main class="site-main" id="main">
    <section class="hero container container--narrow">
      <p class="page-eyebrow" data-i18n="uses.eyebrow">装备</p>
      <h1 class="hero__name" data-i18n="uses.title">我在用什么</h1>
      <p class="lead" data-i18n="uses.lead">日常在用的硬件与软件。有些带推广链接，点一下也算支持我。</p>
    </section>

    <!-- 分类由 renderUses 按 window.USES 生成 -->
    <div class="container" id="uses-root"></div>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <script src="js/site.config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/main.js"></script>

  <!--
    装备页「数据 → DOM」。数据按「分类」组织：window.USES 是分类数组，
    每个分类下有若干 item。渲染时先循环分类、再循环 item，套两层循环。
    外层循环出的每个分类包一个 .subsection（标题 + 卡片网格）。
  -->
  <script>
  (function () {
    "use strict";

    var ICON = window.icon || function () { return ""; };
    var I18N = window.i18n || { t: function (k) { return k; }, getLang: function () { return "zh"; } };

    // 本页内容数据：按分类分组。每类：title 双语 / icon 图标 / items 列表。
    // item：name 名称 / note 双语说明 / url 链接（可空，空则不外链）/ affiliate 是否推广
    window.USES = [
      {
        title: { zh: "开发设备", en: "Dev machine" }, icon: "code",
        items: [
          { name: "ThinkPad X 系列", note: { zh: "主力笔记本，键盘手感无可替代。", en: "Daily laptop — the keyboard is irreplaceable." }, url: "" },
          { name: "VS Code", note: { zh: "主力编辑器，配一堆小插件。", en: "Main editor, with a pile of small extensions." }, url: "https://code.visualstudio.com" },
          { name: "Windows + WSL2", note: { zh: "Linux 工具链在 Windows 上跑得很顺。", en: "Linux toolchain on Windows, surprisingly smooth." }, url: "" },
        ],
      },
      {
        title: { zh: "硬件玩具", en: "Hardware toys" }, icon: "tool",
        items: [
          { name: "逻辑分析仪", note: { zh: "调串口和 SPI/I2C 的救命工具。", en: "Lifesaver for debugging UART / SPI / I2C." }, url: "" },
          { name: "示波器", note: { zh: "看波形必备，哪怕只是确认有没有信号。", en: "Must-have for waveforms, even just to confirm a signal exists." }, url: "" },
          { name: "3D 打印机", note: { zh: "外壳和支架说打就打。", en: "Enclosures and brackets, printed on demand." }, url: "" },
        ],
      },
      {
        title: { zh: "日常软件", en: "Daily software" }, icon: "layout",
        items: [
          { name: "Obsidian", note: { zh: "笔记与知识库，本地优先。", en: "Notes & knowledge base, local-first." }, url: "https://obsidian.md" },
          { name: "f.lux", note: { zh: "晚上护眼，屏幕少点蓝。", en: "Eyesaver at night — less blue light." }, url: "" },
        ],
      },
    ];

    function renderUses() {
      var lang = I18N.getLang();
      var root = document.getElementById("uses-root");
      if (!root) return;

      root.innerHTML = (window.USES || []).map(function (cat) {
        var title = (cat.title && cat.title[lang]) ? cat.title[lang] : (cat.title && cat.title.zh) || cat.icon;
        // 分类图标 + 分类标题
        var head =
          '<h2 class="subsection__title">' + ICON(cat.icon || "layout") +
          "<span>" + title + "</span></h2>";

        // 该分类下的卡片网格：每个 item 一张卡
        var cards = (cat.items || []).map(function (it) {
          var note = (it.note && it.note[lang]) ? it.note[lang] : (it.note && it.note.zh) || "";
          var isExt = it.url && it.url.indexOf("http") === 0;
          var attrs = isExt ? ' href="' + it.url + '" target="_blank" rel="noopener"' : ' href="#"';
          return (
            '<a class="card"' + attrs + ">" +
              '<span class="card__title"><span>' + it.name + "</span></span>" +
              '<span class="card__desc">' + note + "</span>" +
              (isExt ? '<span class="card__link ml-auto">' + I18N.t("projects.view") + ICON("external") + "</span>" : "") +
            "</a>"
          );
        }).join("");

        // 外层：一个 .subsection 包标题 + 网格
        return (
          '<section class="subsection">' +
            head +
            '<div class="card-grid">' + cards + "</div>" +
          "</section>"
        );
      }).join("");
    }

    window.renderUses = renderUses;
    renderUses();
  })();
  </script>
</body>
</html>
