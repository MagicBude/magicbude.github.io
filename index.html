<!DOCTYPE html>
<!--
  index.html - 开屏页（封面）
  作用：站点入口封面，站名 + slogan + 「进入」按钮；右上角放皮肤 / 语言切换。
  协同：js/site.config.js（站名注入 #splash-name）、js/main.js（注入右上角控件）、js/i18n.js（slogan / 按钮多语）。
  数据驱动：正文文案由 SITE_CONFIG / i18n 运行时填充，本文件只留结构骨架。
  皮肤 / 语言在 CSS 加载前由 head 内防闪白内联脚本设好。
-->
<html lang="zh" data-style="magazine" data-scheme="light">
<!-- #region 头部 head（meta / 防闪白脚本 / 样式） -->
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>magicbude</title>
  <meta name="description" content="magicbude 的个人数字基地：汇集项目、文章、近况、工具、收藏与其他网站入口。">

  <!--
    防闪白内联脚本：必须在 CSS 加载之前执行。
    原因：皮肤（data-style）和语言（lang）存在 localStorage 里。
    如果等外部 JS 加载完才设置，页面会先以默认皮肤闪一下再跳变，很难看。
    这里直接读 localStorage 设到 <html> 上，CSS 一应用就是正确皮肤，无闪烁。
    键名 "site-style" / "site-lang" 必须和 js/main.js、js/i18n.js 里一致。
  -->
  <script>
    (function () {
      try {
        var s = localStorage.getItem("site-style") || "magazine";
        var l = localStorage.getItem("site-lang") || "zh";
        // 明暗由皮肤决定：instrument / terminal 暗，minimal / magazine 亮。
        var scheme = (s === "instrument" || s === "terminal") ? "dark" : "light";
        var d = document.documentElement;
        d.setAttribute("data-style", s);
        d.setAttribute("data-scheme", scheme);
        d.setAttribute("lang", l);
      } catch (e) {}
    })();
  </script>

  <link rel="stylesheet" href="assets/css/main.css">
  <!-- favicon 使用本地 SVG 文件，各页面共享同一图标，修改时只维护一处。 -->
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
<!-- #endregion -->
</head>
<!-- #region 开屏页主体（名字 / slogan / 进入 + 控件容器） -->
<body>
  <!-- 开屏页：极简封面。名字 + slogan + 进入按钮，右上角放皮肤/语言切换。 -->
  <!-- 开屏内容是本页唯一主要内容，因此使用 main，而不是无语义 div。 -->
  <main class="splash">
    <!-- 背景星尘粒子（canvas）：纯装饰、不挡点击；JS 没跑也有下面的静态光晕兜底。 -->
    <canvas class="splash__canvas" id="splash-canvas" aria-hidden="true"></canvas>
    <!-- 右上角控件容器：内容由 js/main.js 注入（皮肤选择器 + 语言切换） -->
    <div class="splash__controls" id="splash-controls"></div>

    <div class="splash__inner">
      <!-- 站点名由 JS 从 site.config.js 填入；这里写个兜底，JS 没跑也不会空白 -->
      <h1 class="splash__name" id="splash-name">magicbude</h1>
      <span class="splash__slogan" data-i18n="splash.subtitle">个人数字基地</span>
      <div>
        <!-- 「进入」跳到真正的首页 home.html（index.html 被本开屏页占用） -->
        <a class="btn btn--primary splash__enter" href="home/index.html" data-i18n="splash.enter">进入</a>
      </div>
    </div>
  </main>

  <!-- 脚本顺序不能乱：先配置，再图标，再多语，最后主逻辑 -->
<!-- #endregion -->
<!-- #region 脚本（依赖加载） -->
  <script src="assets/js/core/site.config.js"></script>
  <script src="assets/js/core/icons.js"></script>
  <script src="assets/js/core/i18n.js"></script>
  <script src="assets/js/core/main.js"></script>
<!-- #endregion -->
</body>
</html>
