<!DOCTYPE html>
<html lang="zh" data-style="instrument" data-scheme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>magicbude · 个人网站</title>
  <meta name="description" content="magicbude 的个人网站：代码、游戏、动漫、电影、羽毛球的数字花园，也挂着做过的其他网站和小工具。">

  <!--
    防闪白内联脚本：必须在 CSS 加载之前执行（原理同 index.html 开屏页）。
    作用：从 localStorage 读出皮肤/语言，提前设到 <html> 上，
    这样外部 CSS 一应用就是正确的皮肤，避免"先默认皮肤闪一下再跳变"。
    键名 "site-style" / "site-lang" 必须和 js/main.js、js/i18n.js 里一致。
  -->
  <script>
    (function () {
      try {
        var s = localStorage.getItem("site-style") || "instrument";
        var l = localStorage.getItem("site-lang") || "zh";
        // 明暗由皮肤决定：instrument / terminal 暗，minimal / magazine 亮。
        var scheme = (s === "instrument" || s === "terminal") ? "dark" : "light";
        var d = document.documentElement;
        d.setAttribute("data-style", s);
        d.setAttribute("data-scheme", scheme);
        d.setAttribute("lang", l);
      } catch (e) {}
    })();
  </script>

  <link rel="stylesheet" href="css/main.css">
  <!-- 内联 SVG favicon：带圆角的小方块，零外链 -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d1117'/%3E%3Crect x='9' y='9' width='14' height='14' rx='4' fill='%234aa8ff'/%3E%3C/svg%3E">
</head>
<body>
  <!-- 跳到主内容：键盘用户按 Tab 第一个就能聚焦，对屏幕阅读器友好 -->
  <a class="skip-link" href="#main" data-i18n="common.skip">跳到主内容</a>

  <!-- 顶部导航栏容器：内容由 js/main.js 根据 site.config.js 注入（数据驱动，不写死） -->
  <header id="site-header" class="site-header"></header>

  <main class="site-main" id="main">
    <!-- ============ Hero 区 ============ -->
    <!-- 文案全部由底部内联脚本从 site.config.js 填入，这里只放兜底文字，
         JS 没跑也不会空白。这也是「数据 → DOM」最直观的例子。 -->
    <section class="hero container">
      <p class="hero__greeting" data-i18n="home.greeting">你好，我是</p>
      <h1 class="hero__name" id="hero-name">magicbude</h1>
      <!-- 小徽章：一句话定位，随语言切换 -->
      <span class="hero__tagline" id="hero-tagline" data-i18n="home.badge">在代码与兴趣之间</span>
      <!-- 自我介绍：从 site.config.js 的 bio 字段取，多语 -->
      <p class="hero__intro" id="hero-bio">我是 magicbude，一个喜欢动手的全栈开发者。</p>
    </section>

    <!-- ============ 去哪儿（板块入口） ============ -->
    <section class="section container">
      <div class="section__header">
        <h2 class="section__title" data-i18n="home.section.entries">去哪儿</h2>
      </div>
      <!-- 卡片由内联脚本根据 site.config.js 的 nav 生成（排除首页与搜索） -->
      <div class="card-grid" id="entry-cards"></div>
    </section>

    <!-- ============ 最新动态 ============ -->
    <section class="section container">
      <div class="section__header">
        <h2 class="section__title" data-i18n="home.section.recent">最新动态</h2>
        <a class="section__more" href="blog.html">
          <span data-i18n="section.viewAll">查看全部</span>
          <!-- 右箭头图标（与 js/icons.js 的 arrowRight 一致） -->
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12h14"/><path d="m13 6 6 6-6 6"/>
          </svg>
        </a>
      </div>
      <!-- 文章列表：构建脚本生成 js/posts.js（window.POSTS）后自动填充；没有时显示空状态 -->
      <div class="post-list" id="recent-posts"></div>
    </section>
  </main>

  <!-- 页脚容器：内容由 js/main.js 注入（版权 + 社交链接） -->
  <footer id="site-footer" class="site-footer"></footer>

  <!-- 脚本顺序不能乱：先配置，再图标，再多语，最后主逻辑 -->
  <script src="js/site.config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/main.js"></script>

  <!--
    首页特有的「数据 → DOM」渲染脚本。
    放在 body 末尾、主脚本之后，DOM 已就绪，且 main.js 已经把头部/页脚注好。
    这里做的三件事，都是前端最基础也最常用的模式：
      1) 把配置里的文本填进 Hero（名字 / 定位 / 简介）
      2) 把导航项渲染成"去哪儿"卡片网格
      3) 如果构建脚本已生成文章数据（window.POSTS），渲染最新几条
    把它挂到 window.renderHome，main.js 在切换语言时会再调一次，保证文案同步刷新。
  -->
  <script>
  (function () {
    "use strict";

    // 取全局模块，给兜底防止某个脚本没加载导致报错。
    var CONFIG = window.SITE_CONFIG || {};
    var ICON  = window.icon  || function () { return ""; };
    var I18N  = window.i18n  || { t: function (k) { return k; }, getLang: function () { return "zh"; } };

    // 导航 key → 图标名（icons.js 里已有的图标）。
    var NAV_ICON = {
      home: "home", blog: "book", projects: "code",
      now: "sparkles", uses: "tool", links: "link",
      search: "search", about: "user"
    };

    // 板块卡片的一句话说明（多语）。纯页面文案，放这里最直观。
    var ENTRY_DESC = {
      blog:     { zh: "写代码、做小工具的记录与踩坑",   en: "Notes & lessons from coding and tinkering" },
      projects: { zh: "我做过的网站、工具与开源项目",   en: "Sites, tools and open-source I've built" },
      now:      { zh: "最近在玩、在看、在搞啥",         en: "What I'm playing, watching and building now" },
      uses:     { zh: "日常在用的硬件与软件",           en: "Hardware & software I use daily" },
      links:    { zh: "朋友们和觉得有用的站",           en: "Friends and useful sites" },
      about:    { zh: "关于我，以及这个站",             en: "About me and this site" }
    };

    // 渲染整个首页（Hero + 卡片 + 最新动态）。幂等，可反复调用。
    function renderHome() {
      var lang = I18N.getLang();

      // ---- 1) Hero ----
      var nameEl  = document.getElementById("hero-name");
      if (nameEl && CONFIG.name) nameEl.textContent = CONFIG.name;

      var tagEl   = document.getElementById("hero-tagline");
      if (tagEl && CONFIG.tagline) tagEl.textContent = CONFIG.tagline[lang] || CONFIG.tagline.zh;

      var bioEl   = document.getElementById("hero-bio");
      if (bioEl && CONFIG.bio) bioEl.textContent = CONFIG.bio[lang] || CONFIG.bio.zh;

      // ---- 2) 去哪儿：把导航渲染成卡片，排除"首页"和"搜索"两项 ----
      var grid = document.getElementById("entry-cards");
      if (grid && CONFIG.nav) {
        var cards = CONFIG.nav
          .filter(function (it) { return it.key !== "home" && it.key !== "search"; })
          .map(function (it) {
            var ic  = NAV_ICON[it.key] || "layout";     // 找不到图标就退回 layout
            var label = I18N.t(it.i18n);
            var desc  = ENTRY_DESC[it.key] ? (ENTRY_DESC[it.key][lang] || ENTRY_DESC[it.key].zh) : "";
            return (
              '<a class="card" href="' + it.href + '">' +
                '<span class="card__title">' + ICON(ic) + "<span>" + label + "</span></span>" +
                '<span class="card__desc">' + desc + "</span>" +
                '<span class="card__link">' + I18N.t("section.viewAll") + ICON("arrowRight") + "</span>" +
              "</a>"
            );
          })
          .join("");
        grid.innerHTML = cards;
      }

      // ---- 3) 最新动态：构建脚本生成 js/posts.js 后，window.POSTS 才有值 ----
      var recent = document.getElementById("recent-posts");
      if (recent) {
        if (window.POSTS && window.POSTS.length) {
          // 取最新 4 篇（假设 POSTS 已按日期倒序）。
          recent.innerHTML = window.POSTS.slice(0, 4).map(function (p) {
            var d = p.date ? String(p.date).slice(0, 10) : "";
            return (
              '<a class="post-item" href="' + (p.url || "#") + '">' +
                '<div class="post-item__title">' + (p.title || "") + "</div>" +
                (p.excerpt ? '<p class="post-item__excerpt">' + p.excerpt + "</p>" : "") +
                '<div class="post-meta">' +
                  '<span class="post-meta__item">' + ICON("book") + d + "</span>" +
                "</div>" +
              "</a>"
            );
          }).join("");
        } else {
          // 还没有文章数据时的占位（构建博客后自动消失）。
          recent.innerHTML = '<p class="empty-state" data-i18n="home.noPosts">' +
            "还没有文章，去博客写第一篇吧。" + "</p>";
        }
      }
    }

    // 暴露出去，让 main.js 在切换语言时能重渲染首页文案。
    window.renderHome = renderHome;

    // 立即渲染一次（脚本在 body 末尾，DOM 已就绪）。
    renderHome();
  })();
  </script>
</body>
</html>
