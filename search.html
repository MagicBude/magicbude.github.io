<!DOCTYPE html>
<html lang="zh" data-style="instrument" data-scheme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>搜索 · magicbude</title>
  <meta name="description" content="在站内搜索博客文章与页面。">

  <script>
    (function () {
      try {
        var s = localStorage.getItem("site-style") || "instrument";
        var l = localStorage.getItem("site-lang") || "zh";
        var scheme = (s === "instrument" || s === "terminal") ? "dark" : "light";
        var d = document.documentElement;
        d.setAttribute("data-style", s);
        d.setAttribute("data-scheme", scheme);
        d.setAttribute("lang", l);
      } catch (e) {}
    })();
  </script>

  <link rel="stylesheet" href="css/main.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d1117'/%3E%3Crect x='9' y='9' width='14' height='14' rx='4' fill='%234aa8ff'/%3E%3C/svg%3E">
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="common.skip">跳到主内容</a>

  <header id="site-header" class="site-header"></header>

  <main class="site-main" id="main">
    <section class="hero container container--narrow">
      <p class="page-eyebrow" data-i18n="search.eyebrow">搜索</p>
      <h1 class="hero__name" data-i18n="search.title">搜一搜</h1>
    </section>

    <section class="section container container--narrow">
      <!-- 搜索框：左侧放大镜图标由 CSS 绝对定位浮在上面 -->
      <div class="search-form">
        <span class="icon-wrap" id="search-icon"></span>
        <input
          id="search-input"
          class="search-input"
          type="search"
          autocomplete="off"
          data-i18n="common.searchPlaceholder"
          placeholder="搜索文章…"
          aria-label="搜索">
      </div>

      <p class="search-stats" id="search-stats" hidden></p>
      <p class="search-stats" id="search-hint" data-i18n="search.hint">支持搜索博客文章与站内页面。</p>

      <!-- 结果列表由 renderSearch 填充 -->
      <div class="result-list" id="search-results"></div>
      <p class="empty-state" id="search-empty" hidden data-i18n="search.empty">没有匹配的内容，换个关键词试试。</p>
    </section>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <script src="js/site.config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/main.js"></script>

  <!--
    搜索页「数据 → DOM」+ 事件驱动。
    思路：
      1) 建索引：把「页面 / 博客文章 / 项目 / 链接」统一成一种结构 {title, url, excerpt, kind}，
         存进 INDEX 数组。这样后面过滤逻辑只认这一种结构，不用管数据来自哪。
      2) 过滤：输入时取输入框文字，转小写，去 title/excerpt/kind 里 substring 匹配。
      3) 渲染：把命中项拼成 .result 卡片，带类型徽章。
    这是「把异构数据先归一、再做统一处理」的常见前端套路，值得记住。
  -->
  <script>
  (function () {
    "use strict";

    var ICON = window.icon || function () { return ""; };
    var I18N = window.i18n || { t: function (k) { return k; }, getLang: function () { return "zh"; } };
    var CONFIG = window.SITE_CONFIG || {};

    var INDEX = [];        // 全局搜索索引
    var bound = false;      // 输入监听只绑定一次，避免语言切换时重复绑定

    // 把任意字符串安全地转小写（防止 null/undefined 报错）
    function lc(s) { return (s || "").toString().toLowerCase(); }

    // 用当前语言取双语字段
    function bi(field) {
      var lang = I18N.getLang();
      return (field && field[lang]) ? field[lang] : (field && field.zh) || "";
    }

    // 建索引：从多个数据源归一成一个数组。
    function buildIndex() {
      var items = [];

      // 1) 站内页面（来自导航配置）
      (CONFIG.nav || []).forEach(function (n) {
        // 搜索页自身不进索引，避免自己搜自己。
        if (n.key === "search") return;
        items.push({
          title: I18N.t(n.i18n),
          url: n.href,
          excerpt: "",
          kind: "page",
        });
      });

      // 2) 博客文章（构建脚本会生成 window.POSTS；没有就跳过）
      (window.POSTS || []).forEach(function (p) {
        items.push({
          title: p.title || "",
          url: p.url || "",
          excerpt: p.excerpt || "",
          kind: "blog",
        });
      });

      // 3) 项目（window.PROJECTS，本页同文件里定义）
      (window.PROJECTS || []).forEach(function (p) {
        items.push({
          title: p.title || "",
          url: p.url || "",
          excerpt: bi(p.desc),
          kind: "project",
        });
      });

      // 4) 友链 / 资源（window.LINKS）
      var links = window.LINKS || {};
      ["friends", "resources"].forEach(function (grp) {
        (links[grp] || []).forEach(function (l) {
          items.push({
            title: l.name || "",
            url: l.url || "",
            excerpt: bi(l.note),
            kind: "link",
          });
        });
      });

      INDEX = items;
    }

    // 渲染：根据当前输入框文字过滤并画结果。
    function renderSearch() {
      buildIndex(); // 每次重渲染都重建索引，保证博客/项目数据最新
      var lang = I18N.getLang();
      var q = lc(document.getElementById("search-input").value).trim();
      var results = document.getElementById("search-results");
      var empty = document.getElementById("search-empty");
      var stats = document.getElementById("search-stats");
      var hint = document.getElementById("search-hint");
      if (!results) return;

      // substring 匹配：空查询 → 显示全部（相当于站内地图）
      var hits = INDEX.filter(function (it) {
        if (!q) return true;
        return lc(it.title).indexOf(q) >= 0 ||
               lc(it.excerpt).indexOf(q) >= 0 ||
               lc(it.kind).indexOf(q) >= 0;
      });

      // 统计与提示的显隐
      if (q) {
        if (stats) {
          stats.hidden = false;
          // {n} 占位符替换成真实数量（i18n 里写 "找到 {n} 条结果"）
          stats.textContent = I18N.t("search.results").replace("{n}", hits.length);
        }
        if (hint) hint.hidden = true;
      } else {
        if (stats) stats.hidden = true;
        if (hint) hint.hidden = false;
      }

      if (hits.length === 0) {
        results.innerHTML = "";
        if (empty) empty.hidden = false;
        return;
      }
      if (empty) empty.hidden = true;

      // 命中项 → 结果卡片。type 徽章用 i18n 的 search.kind.*
      results.innerHTML = hits.map(function (it) {
        var kindLabel = I18N.t("search.kind." + it.kind);
        var excerpt = it.excerpt
          ? '<p class="result__excerpt">' + it.excerpt + "</p>"
          : "";
        return (
          '<a class="result" href="' + it.url + '">' +
            '<span class="result__kind">' + kindLabel + "</span>" +
            '<span class="result__title">' + it.title + "</span>" +
            excerpt +
          "</a>"
        );
      }).join("");
    }

    // 首次绑定输入监听（只一次）
    function bindOnce() {
      if (bound) return;
      var input = document.getElementById("search-input");
      var iconHost = document.getElementById("search-icon");
      if (iconHost) iconHost.innerHTML = ICON("search");
      if (input) {
        // input 事件在每次按键/输入变化时触发，比 change（失焦才触发）更跟手。
        input.addEventListener("input", renderSearch);
        bound = true;
      }
    }

    // 暴露给 main.js 的语言切换钩子
    window.renderSearch = function () { bindOnce(); renderSearch(); };

    // 页面加载即初始化
    bindOnce();
    renderSearch();
  })();
  </script>
</body>
</html>
