<!DOCTYPE html>
<!--
  projects/index.html - 项目页
  协同：assets/js/core/ 公共脚本与 assets/js/data/projects.js 共享项目数据。
  数据驱动：window.renderProjects 将 window.PROJECTS 分成当前作品与孵化项目，
  并从 status 计算统计数字、状态徽章和链接语义；切换语言时由 main.js 触发重绘。
-->
<html lang="zh" data-style="magazine" data-scheme="light">
<!-- #region 头部 head（meta / 防闪白脚本 / 样式） -->
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>项目 · magicbude</title>
  <meta name="description" content="magicbude 已经完成、正在制作和计划中的网站、工具与项目。">

  <!-- 防闪白内联脚本：CSS 加载前先按 localStorage 设皮肤/语言，键名与 main.js / i18n.js 一致 -->
  <script>
    (function () {
      try {
        var s = localStorage.getItem("site-style") || "magazine";
        var l = localStorage.getItem("site-lang") || "zh";
        var scheme = (s === "instrument" || s === "terminal") ? "dark" : "light";
        var d = document.documentElement;
        d.setAttribute("data-style", s);
        d.setAttribute("data-scheme", scheme);
        d.setAttribute("lang", l);
      } catch (e) {}
    })();
  </script>

  <link rel="stylesheet" href="../assets/css/main.css">
<!-- #endregion -->
  <link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
<!-- #region 页面骨架（导航 / 页脚容器 + 内容区块） -->
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="common.skip">跳到主内容</a>

  <!-- 头部容器：js/main.js 根据 site.config.js 注入导航（数据驱动，不写死） -->
  <header id="site-header" class="site-header"></header>

  <main class="site-main" id="main">
    <!-- #region 项目引言与数据概览 -->
    <section class="hero container projects-hero">
      <div class="projects-hero__copy">
        <p class="page-eyebrow" data-i18n="projects.eyebrow">作品</p>
        <h1 class="hero__name" data-i18n="projects.title">项目</h1>
        <p class="lead" data-i18n="projects.lead">记录已经运行的作品，也保存仍在孵化、等待慢慢成形的想法。</p>
      </div>

      <!-- 数字不写死：renderProjects 会依据 PROJECTS 的 status 在每次重绘时重新计算。 -->
      <dl class="project-stats" id="project-stats" data-i18n="projects.statsLabel" data-i18n-attr="aria-label">
        <div class="project-stat">
          <dd class="project-stat__value" id="project-total">0</dd>
          <dt class="project-stat__label" data-i18n="projects.stat.total">收录项目</dt>
        </div>
        <div class="project-stat">
          <dd class="project-stat__value" id="project-active">0</dd>
          <dt class="project-stat__label" data-i18n="projects.stat.active">正在运行</dt>
        </div>
        <div class="project-stat">
          <dd class="project-stat__value" id="project-incubating">0</dd>
          <dt class="project-stat__label" data-i18n="projects.stat.incubating">孵化中</dt>
        </div>
      </dl>
    </section>
    <!-- #endregion 项目引言与数据概览 -->

    <!-- #region 当前作品 -->
    <section class="section container" id="projects-current-section">
      <div class="section__header projects-section-heading">
        <div>
          <h2 class="section__title" data-i18n="projects.current.title">当前作品</h2>
          <p class="projects-section-heading__lead" data-i18n="projects.current.lead">已经可以访问、持续维护，并且最能代表当前实践的项目。</p>
        </div>
      </div>
      <!-- 代表作品使用横向大卡；视觉区只表现真实技术栈，不伪造产品截图。 -->
      <div class="projects-current" id="projects-current"></div>
    </section>
    <!-- #endregion 当前作品 -->

    <!-- #region 孵化项目 -->
    <section class="section container" id="projects-incubator-section">
      <div class="section__header projects-section-heading">
        <div>
          <h2 class="section__title" data-i18n="projects.incubator.title">孵化中的实验</h2>
          <p class="projects-section-heading__lead" data-i18n="projects.incubator.lead">一些尚未完成、但值得继续探索的方向。</p>
        </div>
      </div>
      <!-- 规划项目降低视觉层级，与已经运行的作品明确区分。 -->
      <div class="project-incubator-grid" id="projects-incubator"></div>
      <!-- 空态：没有任何项目时显示（可由 i18n 翻译） -->
      <p class="empty-state" id="projects-empty" hidden data-i18n="projects.empty">还没有公开的项目，先去 GitHub 看看？</p>
      <noscript>
        <p class="empty-state">本站项目列表需要 JavaScript 读取本地数据；你仍可直接访问 <a href="https://github.com/magicbude">magicbude 的 GitHub</a>。</p>
      </noscript>
    </section>
    <!-- #endregion 孵化项目 -->
  </main>

  <footer id="site-footer" class="site-footer"></footer>

<!-- #endregion -->
<!-- #region 脚本（依赖加载 + 本页数据 -> DOM 渲染） -->
  <!-- 脚本顺序：配置 → 图标 → 多语 → 主逻辑 -->
  <script src="../assets/js/core/site.config.js"></script>
  <script src="../assets/js/core/icons.js"></script>
  <script src="../assets/js/core/i18n.js"></script>
  <!-- 项目数据独立加载，使项目页和搜索页可以共享同一份 window.PROJECTS。 -->
  <script src="../assets/js/data/projects.js"></script>
  <script src="../assets/js/core/main.js"></script>

  <!--
    项目页「数据 → DOM」渲染脚本。
    - window.PROJECTS 是本页的「内容数据源」：每加一个项目，只往数组里加一项即可，
      不用碰 HTML。这就是你学前端最该吃透的套路：数据 + 循环 = 页面。
    - 挂到 window.renderProjects：main.js 切语言时会调用，让卡片文案/状态跟着变。
  -->
  <script>
  (function () {
    "use strict";

    var ICON = window.icon || function () { return ""; };
    var I18N = window.i18n || { t: function (k) { return k; }, getLang: function () { return "zh"; } };

    // 状态 → 徽章样式类 + i18n key 的映射表。集中放一处，改语义只动这里。
    var STATUS = {
      active: { cls: "badge--ok",  key: "projects.status.active" },
      wip:    { cls: "badge--wip", key: "projects.status.wip" },
      idea:   { cls: "badge--wip", key: "projects.status.idea" },
      arch:   { cls: "badge--arch", key: "projects.status.arch" },
    };

    var LINK_TEXT = {
      site: "projects.visitSite",
      profile: "projects.visitGithub",
      project: "projects.viewProject",
    };

    // 数据最终进入 innerHTML；统一转义可以避免标题或简介里的特殊字符被解释为标签。
    function escapeHtml(value) {
      return String(value == null ? "" : value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // 中英文内容遵循同一回退规则：当前语言缺失时回到中文，保证页面不会出现空标题。
    function localize(value, lang) {
      if (!value) return "";
      return value[lang] != null ? value[lang] : value.zh || "";
    }

    function renderBadge(project) {
      var status = STATUS[project.status];
      return status
        ? '<span class="badge ' + status.cls + '">' + escapeHtml(I18N.t(status.key)) + "</span>"
        : "";
    }

    function renderTags(project) {
      return (project.tags || []).map(function (tag) {
        return '<span class="tag">' + escapeHtml(tag) + "</span>";
      }).join("");
    }

    // 内链交给 siteUrl 适配本地双击与 GitHub Pages；外链补齐安全属性与外链图标。
    function getLink(project) {
      var rawUrl = project.url || "projects/index.html";
      var external = rawUrl.indexOf("http") === 0;
      return {
        url: external ? rawUrl : window.siteUrl(rawUrl),
        attrs: external ? ' target="_blank" rel="noopener"' : "",
        icon: external ? "external" : "arrowRight",
        text: I18N.t(LINK_TEXT[project.linkType] || "projects.viewProject"),
      };
    }

    function renderCurrentProject(project, lang, index) {
      var link = getLink(project);
      var title = localize(project.title, lang);
      var desc = localize(project.desc, lang);
      var highlights = localize(project.highlights, lang) || [];
      var stack = project.tags || [];

      return (
        '<article class="project-showcase">' +
          '<div class="project-showcase__visual" aria-hidden="true">' +
            '<span class="project-showcase__number">' + String(index + 1).padStart(2, "0") + "</span>" +
            '<span class="project-showcase__signal"></span>' +
            '<div class="project-showcase__stack">' + stack.map(function (item) {
              return "<span>" + escapeHtml(item) + "</span>";
            }).join("") + "</div>" +
          "</div>" +
          '<div class="project-showcase__body">' +
            '<div class="project-showcase__kicker">' + renderBadge(project) +
              '<span>' + escapeHtml(I18N.t("projects.current.eyebrow")) + "</span></div>" +
            '<h3 class="project-showcase__title">' + ICON(project.icon || "layout") +
              "<span>" + escapeHtml(title) + "</span></h3>" +
            '<p class="project-showcase__desc">' + escapeHtml(desc) + "</p>" +
            (highlights.length ? '<div class="project-showcase__highlights"><p>' +
              escapeHtml(I18N.t("projects.highlights")) + "</p><ul>" +
              highlights.map(function (item) { return "<li>" + escapeHtml(item) + "</li>"; }).join("") +
              "</ul></div>" : "") +
            '<div class="project-showcase__footer"><div class="project-showcase__tags">' + renderTags(project) +
              '</div><a class="btn btn--primary project-showcase__action" href="' + escapeHtml(link.url) + '"' + link.attrs + ">" +
                escapeHtml(link.text) + ICON(link.icon) + "</a></div>" +
          "</div>" +
        "</article>"
      );
    }

    function renderIncubatingProject(project, lang, index) {
      var link = getLink(project);
      return (
        '<article class="project-incubator-card">' +
          '<header class="project-incubator-card__header">' +
            '<span class="project-incubator-card__index">' + String(index + 1).padStart(2, "0") + "</span>" +
            renderBadge(project) +
          "</header>" +
          '<div class="project-incubator-card__icon">' + ICON(project.icon || "code") + "</div>" +
          '<h3 class="project-incubator-card__title">' + escapeHtml(localize(project.title, lang)) + "</h3>" +
          '<p class="project-incubator-card__desc">' + escapeHtml(localize(project.desc, lang)) + "</p>" +
          '<footer class="project-incubator-card__footer"><div class="project-incubator-card__tags">' + renderTags(project) +
            '</div><a class="card__link" href="' + escapeHtml(link.url) + '"' + link.attrs + ">" +
              escapeHtml(link.text) + ICON(link.icon) + "</a></footer>" +
        "</article>"
      );
    }

    function renderProjects() {
      var lang = I18N.getLang();
      var currentHost = document.getElementById("projects-current");
      var incubatorHost = document.getElementById("projects-incubator");
      var currentSection = document.getElementById("projects-current-section");
      var incubatorSection = document.getElementById("projects-incubator-section");
      var empty = document.getElementById("projects-empty");
      if (!currentHost || !incubatorHost) return;

      var list = window.PROJECTS || [];
      var current = list.filter(function (project) { return project.featured === true; });
      var incubating = list.filter(function (project) { return project.featured !== true; });

      // 统计来自同一份数据，新增或改变项目状态时无需同步修改 HTML 数字。
      document.getElementById("project-total").textContent = list.length;
      document.getElementById("project-active").textContent = list.filter(function (project) {
        return project.status === "active";
      }).length;
      document.getElementById("project-incubating").textContent = list.filter(function (project) {
        return project.status === "idea" || project.status === "wip";
      }).length;

      if (list.length === 0) {
        currentHost.innerHTML = "";
        incubatorHost.innerHTML = "";
        if (currentSection) currentSection.hidden = true;
        if (incubatorSection) incubatorSection.hidden = false;
        if (empty) empty.hidden = false;
        return;
      }
      if (empty) empty.hidden = true;

      if (currentSection) currentSection.hidden = current.length === 0;
      if (incubatorSection) incubatorSection.hidden = incubating.length === 0;
      currentHost.innerHTML = current.map(function (project, index) {
        return renderCurrentProject(project, lang, index);
      }).join("");
      incubatorHost.innerHTML = incubating.map(function (project, index) {
        return renderIncubatingProject(project, lang, index);
      }).join("");
    }

    // 暴露给 main.js 的语言切换钩子，并立即渲染一次。
    window.renderProjects = renderProjects;
    renderProjects();
  })();
  </script>
<!-- #endregion -->
</body>
</html>
